plugins {
    id 'com.android.application'
}

android {
    namespace 'com.catarapatara'
    compileSdk 34

    defaultConfig {
        applicationId 'com.catarapatara'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '1.0.1'
    }

    signingConfigs {
        release {
            def ks = System.getenv('RELEASE_KEYSTORE')
            storeFile ks ? file(ks) : rootProject.file('keystore/release.jks')
            storePassword System.getenv('RELEASE_STORE_PASSWORD') ?: 'carlauncher'
            keyAlias System.getenv('RELEASE_KEY_ALIAS') ?: 'carlauncher'
            keyPassword System.getenv('RELEASE_KEY_PASSWORD') ?: 'carlauncher'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
