plugins {
    id 'com.android.library'
}

// CataraPatara is built into MYDS (com.thecarlauncher) as a library: one APK, one update.
android {
    namespace 'com.catarapatara'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
