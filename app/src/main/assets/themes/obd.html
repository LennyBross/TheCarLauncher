<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta id="stockcss">
<title>Motor</title>
<link rel="stylesheet" href="common.css">
<style>
/* Engine data from the OBD adapter (ELM327), for the DS4 1.6 e-HDi: gauges first, few words.
   Takes the home theme's look: Stock (champagne, italic), DS4+ (teal cards), Panel 80 (VFD). */
:root{--bg:#07080a;--card:#121418;--chip:#1b1e23;--fg:#EEEAE2;--mut:#8f8a80;--a:#E8D5B0;--hot:#FF6A3D;--ok:#7CD992;--line:rgba(255,255,255,.1);--r:2.6vh}
body{background:var(--bg);color:var(--fg);font-family:'Montserrat',sans-serif;overflow:hidden;user-select:none}
body.t-stock{background:radial-gradient(80% 80% at 50% 35%,#1a1b1e,#050506 70%)}
body.t-ds4{--bg:#0B0E13;--card:#161B23;--chip:#1E252F;--fg:#F3F5F7;--mut:#A3ADBA;--a:#5CC8B0;font-family:'Inter',sans-serif}
body.t-panel{--bg:#030608;--card:transparent;--chip:#0b1114;--fg:var(--pv,#56F2FF);--mut:var(--pv2,#2a8f98);--a:var(--pv,#56F2FF);--hot:#FF4FD8;--line:rgba(var(--pvr,86,242,255),.22);--r:1.2vh;font-family:'Share Tech Mono',monospace}
body.day{--bg:#EEECE8;--card:#fff;--chip:#e6e3de;--fg:#17181b;--mut:#6c6860;--line:rgba(0,0,0,.1)}
body.day.t-stock{background:#EEECE8}body.day.t-stock{--a:#8a6f3e}body.day.t-ds4{--a:#1F8F78}body.day.t-panel{--a:#007f8c;--fg:#007f8c;--mut:#5f9aa0}
svg.ic{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.n{font-variant-numeric:tabular-nums;font-weight:600}
body.t-stock .n{font-style:italic}
body.t-ds4 .n{font-family:'Space Grotesk','Inter',sans-serif;font-weight:700}
body.t-panel .n{font-weight:400;text-shadow:0 0 1vh currentColor}
.card{background:var(--card);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line)}
body.t-stock .card{background:linear-gradient(180deg,rgba(32,33,36,.9),rgba(12,12,14,.9));box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),inset 0 1px 0 rgba(255,255,255,.15)}
body.day.t-stock .card{background:#fff}
.w{position:fixed;inset:0;display:grid;grid-template-columns:1fr 1fr 30%;grid-template-rows:8vh 1fr 22vh;gap:2vh;padding:2.4vh}
.top{grid-column:1/4;display:flex;align-items:center;gap:1.6vh}
.rb{width:7vh;height:7vh;border-radius:50%;border:none;background:var(--chip);color:var(--fg);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px var(--line);flex-shrink:0}
.rb svg{width:3.6vh;height:3.6vh}
.top .eng{width:4.4vh;height:4.4vh;color:var(--a)}
.chip{display:flex;align-items:center;gap:1vh;height:5.6vh;padding:0 2vh;border-radius:3vh;background:var(--chip);color:var(--mut);font-size:2vh;border:none;box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.chip i{width:1.4vh;height:1.4vh;border-radius:50%;background:var(--mut)}
.chip.ok i{background:var(--ok);box-shadow:0 0 1vh var(--ok)}
.chip svg{width:3vh;height:3vh}
#mil.bad{color:#FFB020;box-shadow:inset 0 0 0 1px #FFB020}
#mil.good{color:var(--ok)}
.sp{flex:1}
/* big gauges */
.g{position:relative;display:flex;align-items:center;justify-content:center}
.g svg.arc{position:absolute;width:92%;height:92%;max-width:56vh;max-height:56vh}
.g .in{position:relative;display:flex;flex-direction:column;align-items:center;gap:.4vh}
.g .in svg{width:4vh;height:4vh;color:var(--mut)}
.g .in b{font-size:11vh;line-height:1}
.g .in small{font-size:2.2vh;color:var(--mut)}
/* side gauges */
#side{display:flex;flex-direction:column;gap:2vh}
#side .g{flex:1}
#side .g .in b{font-size:6vh}
#side .g svg.arc{max-width:26vh;max-height:26vh}
/* tiles */
#tiles{grid-column:1/4;display:grid;grid-template-columns:repeat(6,1fr);gap:2vh}
.t{display:flex;flex-direction:column;justify-content:center;gap:.6vh;padding:0 2vh}
.t .h{display:flex;align-items:center;gap:1vh;color:var(--mut)}
.t .h svg{width:4.2vh;height:4.2vh}
.t b{font-size:5.4vh;line-height:1}
.t b small{font-size:2vh;color:var(--mut);margin-left:.6vh;font-weight:500;font-style:normal}
.t.hide{display:none}
/* no adapter */
#none{position:fixed;inset:12vh 2.4vh 2.4vh;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2.4vh;text-align:center}
#none.on{display:flex}
#none svg.big{width:16vh;height:16vh;color:var(--a)}
#none b{font-size:3.6vh}
#none p{font-size:2.2vh;color:var(--mut);max-width:70vh;line-height:1.5}
#none button{height:7vh;padding:0 4vh;border-radius:3.5vh;border:none;background:var(--a);color:#111;font-size:2.4vh;font-family:inherit;font-weight:600}
/* codes */
#sheet{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;padding:2.4vh 3vh;gap:1.6vh;z-index:5}
#sheet.on{display:flex}
#codes{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:1.4vh}
.code{display:flex;align-items:center;gap:2vh;padding:2vh 2.4vh}
.code b{font-size:4vh;width:20vh;color:#FFB020}
.code span{font-size:2.4vh}
.code small{display:block;font-size:1.8vh;color:var(--mut);margin-top:.4vh}
</style>
</head>
<body>
<div class="w" id="main">
  <div class="top">
    <button class="key rb" id="back" aria-label="Geri"><svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <svg class="ic eng" viewBox="0 0 24 24"><path d="M3 15h4l2-3h6l2 3h4"/><path d="M8 12V9h8v3"/><path d="M10 9V6h4v3"/><circle cx="6.5" cy="17.5" r="1.5"/><circle cx="17.5" cy="17.5" r="1.5"/></svg>
    <span class="n" style="font-size:3vh">1.6 e-HDi</span>
    <div class="sp"></div>
    <button class="key chip" id="mil" aria-label="Arıza kodları"><svg class="ic" viewBox="0 0 24 24"><path d="M4 10h2V8h3V6h6v2h2l2 3h2v5h-2l-2 3H9l-2-3H4z"/></svg><span id="milT">—</span></button>
    <button class="key chip" id="cWifi" aria-label="Telefon bağlantısı"><i></i><svg class="ic" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></svg><span id="tWifi">Telefon</span></button>
    <span class="chip" id="st"><i></i><span id="stT">ECU</span></span>
  </div>

  <div class="card g" id="gRpm"><svg class="arc" viewBox="0 0 100 100"></svg><div class="in">
    <svg class="ic" viewBox="0 0 24 24"><path d="M5 18a8 8 0 1 1 14 0"/><path d="M12 13l4-4"/></svg><b class="n" id="vRpm">—</b><small>d/d</small></div></div>
  <div class="card g" id="gBoost"><svg class="arc" viewBox="0 0 100 100"></svg><div class="in">
    <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 5v2M12 12l3-3M5 12h2M17 12h2"/><path d="M3 21c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></svg><b class="n" id="vBoost">—</b><small>bar turbo</small></div></div>
  <div id="side">
    <div class="card g" id="gCool"><svg class="arc" viewBox="0 0 100 100"></svg><div class="in">
      <svg class="ic" viewBox="0 0 24 24"><path d="M12 3v10"/><circle cx="12" cy="16" r="3"/><path d="M15 6h3M15 9h2"/><path d="M3 21c2-1.5 4-1.5 6 0s4 1.5 6 0 4-1.5 6 0"/></svg><b class="n" id="vCool">—</b><small>°C</small></div></div>
    <div class="card g" id="gBatt"><svg class="arc" viewBox="0 0 100 100"></svg><div class="in">
      <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="12" rx="2"/><path d="M7 7V5M17 7V5M7 13h3M15.5 11.5v3M14 13h3"/></svg><b class="n" id="vBatt">—</b><small>V</small></div></div>
  </div>

  <div id="tiles"></div>
</div>

<div id="none">
  <svg class="ic big" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="10" rx="2"/><path d="M7 16v3h10v-3M8 9h8M8 12h5"/><path d="M19 2l-2 2M5 2l2 2"/></svg>
  <b id="noneT">Telefon köprüsü bekleniyor</b>
  <p id="noneP">Adaptörü telefon okur: S26'da MYDS Köprü'yü başlat, mobil erişim noktasını aç ve bu ekranı o ağa bağla. MYDS telefonu kendisi bulur; bulamazsa adresi gir.</p>
  <button class="key" id="setup">Telefon adresi</button>
</div>

<div id="addrM" style="position:fixed;right:2.4vh;top:11vh;z-index:6;display:none;flex-direction:column;gap:1.6vh;width:66vh;padding:2.4vh" class="card">
  <span style="font-size:2.2vh">Telefon adresi <small style="color:var(--mut)">(MYDS Köprü'de yazan)</small></span>
  <input id="addrI" type="text" placeholder="boş = kendisi bulur (ör. 192.168.43.1:47322)" style="height:7vh;border-radius:1.6vh;border:none;background:var(--chip);color:var(--fg);font-size:2.6vh;padding:0 2vh;font-family:inherit;box-shadow:inset 0 0 0 1px var(--line)">
  <span id="addrS" style="font-size:1.9vh;color:var(--mut)"></span>
  <div style="display:flex;gap:1.6vh"><button class="key chip" id="addrAuto" style="flex:1;justify-content:center">Otomatik</button><button class="key chip" id="addrOk" style="flex:1;justify-content:center;background:var(--a);color:#111">Kaydet</button></div>
</div>

<div id="sheet">
  <div style="display:flex;align-items:center;gap:1.6vh">
    <button class="key rb" id="close" aria-label="Kapat"><svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <svg class="ic" style="width:4.4vh;height:4.4vh;color:#FFB020" viewBox="0 0 24 24"><path d="M4 10h2V8h3V6h6v2h2l2 3h2v5h-2l-2 3H9l-2-3H4z"/></svg>
    <span class="n" style="font-size:3vh;flex:1">Arıza kodları</span>
    <button class="key rb" id="reread" aria-label="Yeniden oku"><svg class="ic" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
  </div>
  <div id="codes"></div>
</div>

<script src="common.js"></script>
<script src="dtc_edc17.js"></script>
<script>
var TH = call('theme') || 8;
document.body.classList.add(TH === 7 ? 't-ds4' : TH === 4 ? 't-panel' : 't-stock');

// ---- gauges: 270° arcs
function arc(el, ticks) {
  var svg = $(el).querySelector('svg.arc'), L = 2 * Math.PI * 44 * .75;
  var seg = TH === 4 ? ' stroke-dasharray="2.2 1.4"' : '';
  svg.innerHTML = '<g transform="rotate(135 50 50)"><circle cx="50" cy="50" r="44" fill="none" stroke="var(--line)" stroke-width="' + (TH === 4 ? 5 : 3) + '" stroke-dasharray="' + L.toFixed(1) + ' 400" stroke-linecap="' + (TH === 4 ? 'butt' : 'round') + '"/>' +
    '<circle class="f" cx="50" cy="50" r="44" fill="none" stroke="var(--a)" stroke-width="' + (TH === 4 ? 5 : 3.4) + '" stroke-dasharray="0 400" stroke-linecap="' + (TH === 4 ? 'butt' : 'round') + '"' + '/></g>' +
    (seg ? '<g transform="rotate(135 50 50)"><circle cx="50" cy="50" r="44" fill="none" stroke="var(--bg)" stroke-width="6"' + ' stroke-dasharray="1.2 2.4"/></g>' : '');
  svg._L = L;
}
['gRpm', 'gBoost', 'gCool', 'gBatt'].forEach(function (g) { arc(g); });
function set(g, frac, hot) {
  var svg = $(g).querySelector('svg.arc'), f = svg.querySelector('.f');
  frac = isNaN(frac) ? 0 : Math.max(0, Math.min(1, frac));
  f.setAttribute('stroke-dasharray', (frac * svg._L).toFixed(1) + ' 400');
  f.setAttribute('stroke', hot ? 'var(--hot)' : 'var(--a)');
  if (TH === 4) f.style.filter = 'drop-shadow(0 0 1.2px ' + (hot ? 'var(--hot)' : 'var(--a)') + ')';
}

// ---- tiles: only what the engine answers
var TILES = [
  ['rail', 'MPa', 0, '<path d="M3 12h13"/><path d="M16 8l4 4-4 4"/><circle cx="6" cy="12" r="2"/><circle cx="11" cy="12" r="2"/>', 'Rail basıncı'],
  ['maf', 'g/s', 0, '<path d="M3 8h12a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h8"/>', 'Hava akışı'],
  ['iat', '°C', 0, '<path d="M3 9h10a2.5 2.5 0 1 0-2.5-2.5M3 13h7"/><path d="M17 4v9"/><circle cx="17" cy="16" r="2.6"/>', 'Emme havası'],
  ['oil', '°C', 0, '<path d="M4 15c3 0 4-4 8-4l3-3h4l-2 3-4 6H4z"/><path d="M19 15c0 1.5-1 2.5-1 2.5S17 16.5 17 15s1-2.5 1-2.5 1 1 1 2.5z"/>', 'Yağ'],
  ['load', '%', 0, '<path d="M12 21a9 9 0 1 1 9-9"/><path d="M12 12V3"/><path d="M12 12h9"/>', 'Motor yükü'],
  ['pedal', '%', 0, '<path d="M6 21l3-17h6l3 17z"/><path d="M8.5 9h7M8 13h8"/>', 'Gaz pedalı'],
  ['egr', '%', 0, '<path d="M4 7h11a4 4 0 0 1 0 8H8"/><path d="M11 12l-3 3 3 3"/>', 'EGR'],
  ['fuelPct', '%', 0, '<path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3 21h12M14 9h2a2 2 0 0 1 2 2v5a2 2 0 0 0 4 0V8l-3-3"/><path d="M6 8h6"/>', 'Yakıt'],
  ['dpfT', '°C', 0, '<rect x="3" y="7" width="18" height="10" rx="2"/><path d="M7 7v10M11 7v10M15 7v10"/>', 'Partikül filtresi'],
  ['amb', '°C', 0, '<path d="M12 3v11"/><circle cx="12" cy="17" r="3.5"/>', 'Dış hava'],
  ['run', 'dk', 0, '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/>', 'Çalışma'],
  ['lph', 'L/s', 1, '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>', 'Yakıt debisi']
];
var MAXT = 6;
TILES.forEach(function (t) {
  var d = document.createElement('div'); d.className = 'card t hide'; d.id = 't_' + t[0]; d.setAttribute('aria-label', t[4]);
  d.innerHTML = '<div class="h"><svg class="ic" viewBox="0 0 24 24">' + t[3] + '</svg></div><b class="n"><span>—</span><small>' + t[1] + '</small></b>';
  $('tiles').appendChild(d);
});

// ---- fault codes: short Turkish meaning for the common e-HDi ones
var DTC = {
  P0087: 'Rail basıncı düşük', P0088: 'Rail basıncı yüksek', P0093: 'Yakıt kaçağı', P0101: 'Hava akış sensörü', P0106: 'Manifold basınç sensörü',
  P0113: 'Emme havası sensörü', P0115: 'Hararet sensörü', P0117: 'Hararet sensörü (düşük)', P0118: 'Hararet sensörü (yüksek)', P0045: 'Turbo aktüatörü',
  P0201: 'Enjektör 1', P0202: 'Enjektör 2', P0203: 'Enjektör 3', P0204: 'Enjektör 4', P0234: 'Turbo aşırı basınç', P0299: 'Turbo basıncı düşük',
  P0335: 'Krank sensörü', P0340: 'Eksantrik sensörü', P0380: 'Kızdırma bujisi', P0400: 'EGR akışı', P0401: 'EGR akışı yetersiz', P0403: 'EGR devresi',
  P0470: 'Egzoz basınç sensörü', P0480: 'Fan devresi', P0500: 'Hız sensörü', P0562: 'Akü voltajı düşük', P0563: 'Akü voltajı yüksek',
  P1351: 'Kızdırma kontrol', P2002: 'Partikül filtresi verimi', P2263: 'Turbo performansı', P2463: 'Partikül filtresi kurum dolu', P242F: 'Partikül filtresi kül',
  P2452: 'DPF fark basınç sensörü', P2453: 'DPF fark basınç sensörü', P0670: 'Kızdırma modülü', P0237: 'Turbo basınç sensörü', P0238: 'Turbo basınç sensörü'
};
function meaning(c) {
  if (DTC[c]) return DTC[c];
  var k = c.charAt(0);
  return k === 'P' ? (c.charAt(1) === '1' || c.charAt(1) === '3' ? 'Motor · üreticiye özel' : 'Motor / şanzıman') : k === 'C' ? 'Şasi' : k === 'B' ? 'Gövde' : 'Haberleşme';
}
var lastDtc = '';
function showCodes(list) {
  $('codes').innerHTML = '';
  if (!list.length) {
    $('codes').innerHTML = '<div class="card code" style="justify-content:center;color:var(--ok)"><svg class="ic" style="width:5vh;height:5vh" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg><span>Kayıtlı arıza yok</span></div>';
    return;
  }
  list.forEach(function (c) {
    var d = document.createElement('div'); d.className = 'card code';
    var ecu = window.DTC_EDC17 && DTC_EDC17[c];
    d.innerHTML = '<b class="n">' + c + '</b><span>' + (DTC[c] || (ecu ? '' : meaning(c))) + (ecu ? (DTC[c] ? '<small>' : '<span>') + ecu + (DTC[c] ? '</small>' : '</span>') : '') + '</span>';
    $('codes').appendChild(d);
  });
}

$('back').onclick = function () { call('open', 'themehome'); };
$('cWifi').onclick = function (e) { e.stopPropagation(); var m = $('addrM'), on = m.style.display !== 'flex'; m.style.display = on ? 'flex' : 'none'; if (on) $('addrI').value = (car.s.link && car.s.link.manual) || ''; };
$('addrOk').onclick = function () { call('phoneAddr', $('addrI').value); $('addrM').style.display = 'none'; };
$('addrAuto').onclick = function () { $('addrI').value = ''; call('phoneAddr', ''); $('addrM').style.display = 'none'; };
$('setup').onclick = function (e) { $('cWifi').onclick(e); };
$('mil').onclick = function () { $('sheet').classList.add('on'); };
$('close').onclick = function () { $('sheet').classList.remove('on'); };
$('reread').onclick = function () { call('open', 'obdDtc'); $('codes').style.opacity = .4; setTimeout(function () { $('codes').style.opacity = 1; }, 3000); };

var seenAt = {}, okSince = 0;
car.on(function (s) {
  document.body.classList.toggle('day', s.night === false);
  var o = s.obd || {}, v = o.v || {}, ok = !!o.ok;
  var ln = s.link || {}, ecuLive = v.rpm !== undefined;
  // Two separate lights: the Wi-Fi link to the phone, and fresh data from the ECU.
  $('cWifi').classList.toggle('ok', !!ln.wifi);
  $('tWifi').textContent = ln.wifi ? 'Telefon' : 'Telefon yok';
  $('st').classList.toggle('ok', ecuLive);
  $('stT').textContent = ecuLive ? 'ECU canlı' : ln.wifi ? (o.st || 'ECU bekleniyor').replace(/^OBD:?\s*/, '') : 'ECU —';
  $('addrS').textContent = (ln.wifi ? 'Bağlı · ' : '') + (ln.wifiSt || '');
  var bridge = !!(ln.wifi || ln.addr || ln.manual);
  var none = !o.on && !ok && !bridge;
  $('none').classList.toggle('on', none);
  $('main').style.visibility = none ? 'hidden' : 'visible';
  if (!o.on && o.st) { $('noneT').textContent = 'OBD bağlanamadı'; }
  if (ok && !okSince) okSince = Date.now();
  if (!ok) okSince = 0;

  var rpm = v.rpm;
  $('vRpm').textContent = rpm !== undefined ? Math.round(rpm / 10) * 10 : '—';
  set('gRpm', (rpm || 0) / 5000, rpm > 4400);
  var boost = v.map !== undefined ? Math.max(0, (v.map - (v.baro || 101)) / 100) : NaN;
  $('vBoost').textContent = isNaN(boost) ? '—' : num(boost, 2);
  set('gBoost', boost / 1.6, boost > 1.45);
  $('vCool').textContent = v.cool !== undefined ? Math.round(v.cool) : '—';
  set('gCool', ((v.cool || 40) - 40) / 80, v.cool > 108);
  var b = v.batt !== undefined ? v.batt : v.volt;
  $('vBatt').textContent = b !== undefined ? num(b, 1) : '—';
  set('gBatt', ((b || 11) - 11) / 4, b !== undefined && (b < 11.8 || b > 14.9));

  var shown = 0;
  TILES.forEach(function (t) {
    var val = v[t[0]], el = $('t_' + t[0]);
    if (val !== undefined) seenAt[t[0]] = Date.now();
    var has = seenAt[t[0]] && Date.now() - seenAt[t[0]] < 90000;
    if (has && shown < MAXT) {
      shown++;
      el.classList.remove('hide');
      var x = t[0] === 'run' ? (val || 0) / 60 : val;
      el.querySelector('span').textContent = val === undefined ? '—' : t[2] ? num(x, t[2]) : Math.round(x);
    } else el.classList.add('hide');
  });

  var list = o.dtc || [], n = list.length, key = list.join(',');
  $('mil').classList.toggle('bad', n > 0 || v.mil === 1);
  $('mil').classList.toggle('good', ok && n === 0);
  $('milT').textContent = ok || n ? n : '—';
  if (key !== lastDtc || !$('codes').children.length) { lastDtc = key; showCodes(list); }
});
</script>
</body>
</html>
