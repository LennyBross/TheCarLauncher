<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Literatür</title>
<link rel="stylesheet" href="common.css">
<style>
/* LİTERATÜR — a home screen built from published in-vehicle HMI guidance, for use while moving.
   Screen: 1280×720 at ~160 dpi, so 1 dp ≈ 1 px ≈ 0.139 vh.
   - Glances ≤ 2 s, task ≤ 12 s eyes-off-road (NHTSA Visual-Manual Guidelines, 2013): one tap per task,
     at most 6 destinations, nothing to read twice.
   - Text: primary 32 dp, secondary 24 dp (Android for Cars); critical text ≥ 20 arcmin, other ≥ 16 arcmin
     at the driver's eye (ISO 15008 practice / FHWA): at ~75 cm that is ≥ 40 px and ≥ 32 px font size.
   - Touch targets ≥ 76×76 dp, ≥ 23 dp apart (Android for Cars).
   - Contrast ≥ 4.5:1, preferred 7:1 (Android for Cars, FHWA); light-on-dark at night, dark-on-light by day.
   - No moving pictures, no auto-scroll, nothing that entertains the eye (European Statement of Principles 2006).
   - Feedback on touch within 0.25 s (Android for Cars; ESoP 4.3.4.7). */
:root{--bg:#000;--card:#141414;--key:#1F1F1F;--fg:#FFFFFF;--mut:#BDBDBD;--line:#3A3A3A;--a:#FFB000;--on:#000;--hot:#FF5A4A;
  --t1:5.6vh;--t2:4.45vh;--gap:3.2vh;--r:2.4vh}
body.day{--bg:#ECECEC;--card:#FFFFFF;--key:#F4F4F4;--fg:#000000;--mut:#3F3F3F;--line:#C9C9C9;--a:#8A5A00;--on:#fff;--hot:#C62828}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(60vw 60vh at 12% 30%,rgba(255,150,0,.20),transparent 70%),radial-gradient(60vw 70vh at 88% 35%,rgba(40,140,255,.22),transparent 70%),var(--bg);color:var(--fg);font-family:'Inter',sans-serif;overflow:hidden;user-select:none}
button{font-family:inherit;color:inherit;border:none;cursor:pointer}
/* instant press feedback (≤ 0.25 s), no transitions */
button{transition:transform .14s cubic-bezier(.3,.7,.4,1.4),filter .14s}
button:active{filter:brightness(1.35);transform:scale(.94)}
body.day button:active{filter:brightness(.88)}
.glass{-webkit-backdrop-filter:blur(2.4vh) saturate(1.4);backdrop-filter:blur(2.4vh) saturate(1.4)}
.w{position:fixed;inset:0;padding:2.4vh 3vh;display:grid;grid-template-rows:9vh 1fr 21vh;gap:var(--gap)}
/* top line: time, two quick keys (engine sound, day / night), outside temperature */
.tk{display:flex;align-items:center;gap:2.4vh}
.tb{height:8vh;padding:0 2.4vh;border-radius:4vh;display:flex;align-items:center;gap:1.2vh;font-size:3vh;font-weight:700;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px var(--line)}
.tb svg{width:4vh;height:4vh}
.tb.on{background:var(--a);color:var(--on)}
body.day .tb{background:#fff}
#gearT{font-size:var(--t2);color:var(--a);font-weight:700;margin-left:1.6vh}
#media,#spdC{color:var(--fg)}
.top{display:flex;align-items:center;justify-content:space-between;font-size:var(--t1);font-weight:700;font-variant-numeric:tabular-nums}
.top .s{font-size:var(--t2);color:var(--mut);font-weight:500;margin-left:1.4vh}
.mid{display:grid;grid-template-columns:40% 1fr;gap:var(--gap);min-height:0}
.card{background:var(--card);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);min-height:0;position:relative;overflow:hidden}
/* trip card: warm amber glass · player: blue glass (two colours, never the same white) */
#spdC{background:linear-gradient(140deg,rgba(255,176,0,.30),rgba(255,120,0,.08) 60%,rgba(255,176,0,.04));box-shadow:inset 0 0 0 1px rgba(255,190,80,.38),inset 0 .3vh 0 rgba(255,230,180,.18)}
#media{background:linear-gradient(140deg,rgba(60,150,255,.32),rgba(40,90,255,.08) 60%,rgba(60,150,255,.04));box-shadow:inset 0 0 0 1px rgba(110,180,255,.40),inset 0 .3vh 0 rgba(190,225,255,.18)}
body.day #spdC{background:linear-gradient(140deg,#FFE3A8,#FFF4DC);box-shadow:inset 0 0 0 1px #E8B85A}
body.day #media{background:linear-gradient(140deg,#CFE3FF,#EEF5FF);box-shadow:inset 0 0 0 1px #8DB8F2}
/* a slow light sweep across a card while music plays */
#media::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.07) 50%,transparent 70%);transform:translateX(-100%);pointer-events:none}
body.playing #media::after{animation:sweep 6s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-100%)}55%,100%{transform:translateX(100%)}}
/* speed: the one number that matters most; tap = vehicle page */
#spdC{display:flex;flex-direction:column;justify-content:center;padding:2.4vh 3.2vh;text-align:left}
#spd{font-size:21vh;line-height:.95;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.6vh}
.unit{font-size:var(--t2);color:var(--mut);font-weight:600}
.facts{display:flex;gap:4vh;margin-top:2vh}
.fact b{display:block;font-size:var(--t1);font-weight:700;font-variant-numeric:tabular-nums}
.fact span{font-size:var(--t2);color:var(--mut)}
/* now playing + the three media keys */
#media{display:flex;flex-direction:column;justify-content:space-between;padding:2.6vh 3.2vh}
#src{font-size:var(--t2);color:var(--mut);font-weight:600}
#ttl{font-size:var(--t1);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.6vh}
#art{font-size:var(--t2);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;gap:4vh;align-items:center}
.ctl button{width:15vh;height:15vh;border-radius:50%;background:var(--key);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;justify-content:center}
.ctl button svg{width:7vh;height:7vh}
.ctl button{background:rgba(255,255,255,.10);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.ctl #play{width:17vh;height:17vh;background:#4DA3FF;color:#00142E;box-shadow:0 0 0 0 rgba(77,163,255,.5)}
body.playing .ctl #play{animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(77,163,255,.45)}100%{box-shadow:0 0 0 3vh rgba(77,163,255,0)}}
body.day .ctl #play{background:#1565C0;color:#fff}
.ctl #play svg{width:8vh;height:8vh}
/* six destinations, icon + word, each ≥ 76 dp */
.dock{display:grid;grid-template-columns:repeat(7,1fr);gap:2.4vh}
.dock button{background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.04));border-radius:var(--r);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),inset 0 .3vh 0 rgba(255,255,255,.14),0 1vh 2.4vh rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vh;min-width:0}
.dock svg{width:7.2vh;height:7.2vh}
.dock span{font-size:var(--t2);font-weight:600;white-space:nowrap}
.dock button.go{color:var(--a)}
body.day .dock button{background:linear-gradient(180deg,#FFFFFF,#F1F1F1);box-shadow:inset 0 0 0 1px var(--line)}
.dock button.go span{color:var(--fg)}
.dock button{position:relative}
.dock button .live{position:absolute;top:1.6vh;right:1.8vh;width:1.8vh;height:1.8vh;border-radius:50%;background:#2ECC71;display:none}
.dock button.on .live{display:block}
</style>
</head>
<body>
<div class="w">
  <div class="top"><span><span id="clock">--:--</span></span><span class="tk"><button class="tb" id="tMotor" aria-label="Motor sesi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h3l2-3h6l1 2h3l2 2v5h-2l-1 2H8l-2-2H3z"/></svg><span>Motor</span></button><button class="tb" id="tNight" aria-label="Gece / gündüz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="tNightI"></svg><span id="tNightT">Gece</span></button><span><span id="temp">--°</span><span class="s" id="tempL">dış</span></span></span></div>
  <div class="mid">
    <button class="card glass" id="spdC" aria-label="Aracım">
      <div><span id="spd">0</span> <span class="unit">km/h</span><span id="gearT"></span></div>
      <div class="facts">
        <div class="fact"><b id="rng">—</b><span>menzil km</span></div>
        <div class="fact"><b id="avg">—</b><span>L/100 km</span></div>
      </div>
    </button>
    <div class="card glass" id="media">
      <div><div id="src">Medya</div><div id="ttl">Çalan bir şey yok</div><div id="art"></div></div>
      <div class="ctl">
        <button id="prev" aria-label="Önceki"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2.2v14H6zM19 5v14L9.2 12z"/></svg></button>
        <button id="play" aria-label="Çal / duraklat"></button>
        <button id="next" aria-label="Sonraki"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.8 5H18v14h-2.2zM5 5v14l9.8-7z"/></svg></button>
      </div>
    </div>
  </div>
  <div class="dock" id="dock"></div>
</div>
<script src="common.js"></script>
<script>
var PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12.5-7.5z"/></svg>',
    PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.5 5h4v14h-4zM13.5 5h4v14h-4z"/></svg>';
var DOCK = [['nav', 'Harita', 'split'], ['music', 'Müzik', 'music'], ['radio', 'Radyo', 'radio'], ['phone', 'Telefon', 'phone'], ['aa', 'Android Auto', 'aa'], ['eq', 'Hi-Fi', 'eq'], ['settings', 'Ayarlar', 'settings']];
DOCK.forEach(function (d) {
  var b = document.createElement('button'); b.className = 'key go'; b.setAttribute('aria-label', d[1]);
  b.innerHTML = icon(d[0], 'li') + '<span>' + d[1] + '</span><i class="live"></i>'; b.dataset.k = d[0]; b.classList.add('glass');
  b.onclick = function () { call('open', d[2]); };
  $('dock').appendChild(b);
});
// long labels shrink, but never under 24 dp (secondary text)
function fit() {
  [].forEach.call(document.querySelectorAll('.dock span'), function (s) {
    var f = innerHeight * .0445; s.style.fontSize = f + 'px';
    while (s.scrollWidth > s.parentNode.clientWidth - 12 && f > 24) { f -= 1; s.style.fontSize = f + 'px'; }
  });
}
addEventListener('resize', fit); setTimeout(fit, 30);
$('spdC').onclick = function () { call('open', 'vehicle'); };
var nightNow = true, cpHas = false;
$('tMotor').onclick = function () { call('open', cpHas ? 'cpToggle' : 'engine'); };
$('tNight').onclick = function () { call('setNight', !nightNow); };
$('prev').onclick = function () { call('media', 'prev'); };
$('next').onclick = function () { call('media', 'next'); };
$('play').onclick = function () { call('media', 'play'); };
$('play').innerHTML = PLAY;
function n0(v) { return v === undefined || v === null || isNaN(v) ? '—' : String(Math.round(v)); }
function n1(v) { return v === undefined || v === null || isNaN(v) || v <= 0 ? '—' : Number(v).toFixed(1).replace('.', ','); }
car.on(function (s) {
  document.body.classList.toggle('day', s.night === false);
  $('clock').textContent = s.time || '--:--';
  var out = s.outdoor !== undefined;
  $('temp').textContent = out ? Math.round(s.outdoor) + '°' : (s.temp !== undefined ? s.temp + '°' : '--°');
  $('tempL').textContent = out ? 'dış' : 'hava';
  var ov = s.obd && s.obd.ok && s.obd.v ? s.obd.v.speed : null;
  $('spd').textContent = n0(ov != null ? ov : (s.speed || 0));
  $('gearT').textContent = s.gearObd ? (/^[1-9]$/.test(s.gearObd) ? 'D' + s.gearObd : s.gearObd) : '';
  nightNow = s.night !== false; cpHas = !!s.cp;
  $('tMotor').classList.toggle('on', !!s.cpOn);
  $('tNightT').textContent = nightNow ? 'Gündüz' : 'Gece';
  $('tNightI').innerHTML = nightNow ? '<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>' : '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>';
  $('rng').textContent = n0(s.range);
  $('avg').textContent = n1(s.avg100 || s.avgL100);
  $('src').textContent = s.srcLabel || 'Medya';
  $('ttl').textContent = s.title || 'Çalan bir şey yok';
  $('art').textContent = s.artist || '';
  $('play').innerHTML = s.playing ? PAUSE : PLAY;
  document.body.classList.toggle('playing', !!s.playing);
  // phone connected to Android Auto: a green dot on its button
  var aa = document.querySelector('.dock button[data-k="aa"]'); if (aa) aa.classList.toggle('on', !!s.aaOn);
});
</script>
</body>
</html>
