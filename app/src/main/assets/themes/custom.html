<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>MYDS Custom</title><link rel="stylesheet" href="common.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Montserrat,sans-serif;--bg:#19191c;--fg:#f4f2f8;--card:#222226;--muted:#b0aeba;--a:#a18aff;--shade:#101013;--light:#303036}body.day{--bg:#e8e8ec;--fg:#25242d;--card:#ededf0;--muted:#64626e;--a:#6843cc;--shade:#c4c4ca;--light:#fff}.wrap{height:100vh;padding:3vh 3vw;display:flex;flex-direction:column;gap:2.8vh}header{display:flex;align-items:center;justify-content:space-between;font-size:2.6vh;letter-spacing:.15em}header img{height:5vh;vertical-align:middle;margin-right:1vw}.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:1.4fr 1fr 1fr;gap:2.6vh 1.5vw}.tile{position:relative;min-width:0;min-height:0;border:0;border-radius:2.8vh;background:var(--card);color:var(--fg);box-shadow: .7vh .7vh 1.5vh var(--shade),-.5vh -.5vh 1.2vh var(--light);font:inherit;overflow:hidden}.tile:active{box-shadow:inset .5vh .5vh 1vh var(--shade)}.car{grid-column:span 2;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:1.4vh}.car img{position:absolute;inset:0;width:100%;height:82%;object-fit:contain}.car span{font-size:2.5vh;z-index:1}.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh}.center svg{width:6vh;height:6vh;color:var(--a)}.center b{font-size:5vh;font-weight:500}.small{font-size:2.1vh;color:var(--muted)}.media{grid-column:4;grid-row:2/span 2;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:1.5vh;gap:1vh}.disc{width:15vh;height:15vh;max-width:90%;aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,#1b1b20 0 2px,#292930 3px 4px);display:grid;place-items:center;animation:spin 8s linear infinite;animation-play-state:paused}.disc.on{animation-play-state:running}.disc i{width:37%;height:37%;border-radius:50%;background:var(--a);border:2px solid #aaa}.track{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:2.2vh}.controls{display:flex;justify-content:space-around;width:100%}.controls button{background:none;color:var(--fg);border:0;font-size:3.7vh;min-width:5vh;min-height:6vh}.progress{height:.65vh;background:var(--shade);width:95%;border-radius:1vh;overflow:hidden}.progress i{display:block;height:100%;background:var(--a)}@keyframes spin{to{transform:rotate(360deg)}}footer{display:flex;justify-content:space-between;font-size:2vh;color:var(--muted)}footer button{border:0;background:none;color:var(--a);font:inherit;min-height:5vh}
</style></head><body><main class="wrap"><header><span><img src="ds-logo.png" alt="">MYDS <b style="color:var(--a)">CUSTOM</b></span><span id="status">—</span></header><section class="grid"><button class="tile car" onclick="call('open','vehicle')"><img src="3d/home/h06.webp" alt="DS4"><span>Citroën DS4 · 10 KE 24</span></button><button class="tile center" onclick="call('open','nav')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M17 19H7a5 5 0 0 1 0-10 6 6 0 0 1 12 2 4 4 0 0 1-2 8Z"/></svg><b id="temp">—</b><span class="small">Hava / GPS</span></button><div class="tile center"><b id="clock">--:--</b><span class="small" id="date"></span></div><div id="buttons" style="display:contents"></div><div class="tile media"><div class="disc" id="disc"><i></i></div><div class="track" id="song">Müzik</div><div class="small track" id="artist">—</div><div class="controls"><button aria-label="Önceki" onclick="call('media','prev')">‹</button><button id="play" aria-label="Oynat veya duraklat" onclick="call('media','play')">▶</button><button aria-label="Sonraki" onclick="call('media','next')">›</button></div><div class="progress"><i id="progress"></i></div></div></section><footer><span id="route">MY DS · 1.6 e-HDi</span><button onclick="call('setNight',false)">Gündüz</button><button onclick="call('setAutoNight')">Otomatik</button><button onclick="call('setNight',true)">Gece</button></footer></main><script src="common.js"></script><script>
var items=[['Uygulamalar','apps','M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z'],['Navigasyon','nav','M3 10 22 2 14 22 11 13Z'],['Telefon','phone','M6 3 10 8 7 11 13 17 16 14 21 18 18 22C9 22 2 14 2 5Z'],['Radyo','radio','M3 8h18v13H3z M6 8 18 2 M7 13h4v4H7z M15 13h3 M15 17h3'],['Çatara Patara','engine','M3 8h4l3-4h7l3 4h2v10h-4l-2 3H8l-3-4H3z'],['Ayarlar','settings','M12 2v4 M12 18v4 M2 12h4 M18 12h4 M5 5l3 3 M16 16l3 3 M5 19l3-3 M16 8l3-3 M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10']];items.forEach(function(a){var b=document.createElement('button');b.className='tile center';b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="'+a[2]+'"/></svg><span>'+a[0]+'</span>';b.onclick=function(){call('open',a[1])};$('buttons').appendChild(b)});car.on(function(s){document.body.classList.toggle('day',s.night===false);$('clock').textContent=s.time||'--:--';$('date').textContent=s.date||'';$('temp').textContent=s.temp==null?'—':s.temp+'°';$('status').textContent=(s.bt?'BT · ':'')+(s.net||'')+' · '+(s.time||'');$('song').textContent=s.title||'Müzik';$('artist').textContent=s.artist||s.srcLabel||'—';$('disc').classList.toggle('on',!!s.playing);$('play').textContent=s.playing?'Ⅱ':'▶';$('progress').style.width=(s.dur>0?Math.min(100,Math.max(0,100*s.pos/s.dur)):0)+'%';$('route').textContent=s.navActive?(s.navDest||'Navigasyon')+' · '+num(s.navKm,1)+' km':'MY DS · 1.6 e-HDi'});</script></body></html>
