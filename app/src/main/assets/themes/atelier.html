<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Atelier</title>
<link rel="stylesheet" href="common.css">
<style>
/* ATELIER — the DS interior as a watch: a guilloché "clous de Paris" dial in the middle telling
   the time, with speed and fuel as sub-dials; midnight lacquer and rose gold; condensed Archivo.
   Day = mother-of-pearl dial. Everything is a pictogram, numbers carry the information. */
:root{--bg:#0b0d16;--lac:#121626;--gold:#D9A88F;--gold2:#8f6a5a;--ink:#F3ECE6;--mut:#8e8796;--line:rgba(217,168,143,.22)}
body.day{--bg:#e9e5e1;--lac:#f7f4f1;--ink:#1c1a22;--mut:#6f6874;--gold:#a5664c;--gold2:#c9a08f;--line:rgba(165,102,76,.25)}
body{background:radial-gradient(90% 80% at 50% 40%,#171c30 0%,var(--bg) 70%);color:var(--ink);font-family:'Archivo',sans-serif;font-stretch:75%;overflow:hidden;user-select:none}
body.day{background:radial-gradient(90% 80% at 50% 40%,#fbf9f7 0%,var(--bg) 70%)}
svg.ic{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.w{position:fixed;inset:0;display:grid;grid-template-columns:1fr 64vh 1fr;grid-template-rows:1fr 13vh;gap:2.4vh;padding:3vh}
/* side columns */
.col{display:flex;flex-direction:column;justify-content:center;gap:2.4vh}
.stat{display:flex;align-items:center;gap:1.8vh}
.stat svg{width:4vh;height:4vh;color:var(--gold)}
.stat b{font-size:7vh;font-weight:600;line-height:1;letter-spacing:-.1vh;font-variant-numeric:tabular-nums}
.stat small{font-size:2.2vh;color:var(--mut);margin-left:.6vh;font-weight:500}
.hair{height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.right .hair{background:linear-gradient(270deg,var(--line),transparent)}
.right{align-items:flex-end;text-align:right}
#cover{width:15vh;height:15vh;border-radius:1.6vh;object-fit:cover;box-shadow:0 1.6vh 3vh rgba(0,0,0,.45),inset 0 0 0 1px var(--line);background:var(--lac)}
#mt{font-size:4vh;font-weight:600;max-width:34vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ma{font-size:2.4vh;color:var(--mut);max-width:34vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk{display:flex;gap:1.4vh}
.mk button{width:8vh;height:8vh;border-radius:50%;border:none;background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;justify-content:center}
.mk button svg{width:3.4vh;height:3.4vh}
.mk button.pp{width:10vh;height:10vh;color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold)}
/* the watch */
#watch{position:relative;align-self:center;width:64vh;height:64vh}
#watch svg{position:absolute;inset:0;width:100%;height:100%}
#hands{transition:none}
/* bottom: pictogram keys on a lacquer bar */
.bar{grid-column:1/4;display:flex;justify-content:center;gap:3vh;align-items:center}
.bar button{width:10vh;height:10vh;border-radius:50%;border:none;background:var(--lac);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line),0 1vh 2vh rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.bar button svg{width:4.4vh;height:4.4vh}
.bar button:active{color:var(--gold)}
.bar button.gold{color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold),0 1vh 2vh rgba(0,0,0,.35)}
</style>
</head>
<body>
<div class="w">
  <div class="col">
    <div class="stat"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v11"/><circle cx="12" cy="17" r="3.5"/></svg><b id="tmp">--</b><small>°C</small></div>
    <div class="hair"></div>
    <div class="stat"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20 9 4M20 20 15 4M12 6v2M12 11v2M12 16v3"/></svg><b id="rng">--</b><small>km</small></div>
    <div class="hair"></div>
    <div class="stat"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><path d="M4 20 20 4"/></svg><b id="cons">--</b><small>L/100</small></div>
  </div>

  <div id="watch">
    <svg viewBox="0 0 400 400" id="face"></svg>
  </div>

  <div class="col right">
    <img id="cover" alt="">
    <div id="mt">—</div>
    <div id="ma"></div>
    <div class="mk">
      <button class="key" id="prev" aria-label="Önceki"><svg class="ic" viewBox="0 0 24 24"><path d="M6 5v14"/><path d="M19 5 9 12l10 7z"/></svg></button>
      <button class="key pp" id="play" aria-label="Çal / duraklat"><svg class="ic" id="playI" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="key" id="next" aria-label="Sonraki"><svg class="ic" viewBox="0 0 24 24"><path d="M18 5v14"/><path d="M5 5l10 7-10 7z"/></svg></button>
    </div>
  </div>

  <div class="bar" id="bar"></div>
</div>
<script src="common.js"></script>
<script>
// ---- the dial: clous de Paris guilloché, indices, two sub-dials (speed left, fuel right) ----
(function () {
  var g = '<defs>' +
    '<radialGradient id="lq" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#232a48"/><stop offset="1" stop-color="#0d1020"/></radialGradient>' +
    '<radialGradient id="pearl" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e2ddd8"/></radialGradient>' +
    '<linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3d2c0"/><stop offset=".5" stop-color="#b9806a"/><stop offset="1" stop-color="#f0c8b4"/></linearGradient>' +
    '<pattern id="clous" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45 200 200)">' +
      '<rect width="9" height="9" fill="none"/><path d="M0 0L4.5 4.5L9 0M0 9L4.5 4.5L9 9" stroke="rgba(255,255,255,.07)" stroke-width=".8"/></pattern>' +
    '<clipPath id="dc"><circle cx="200" cy="200" r="176"/></clipPath></defs>';
  g += '<circle cx="200" cy="200" r="196" fill="url(#rg)"/><circle cx="200" cy="200" r="188" fill="#0a0c16"/>';
  g += '<circle cx="200" cy="200" r="176" id="dialBg" fill="url(#lq)"/><rect x="0" y="0" width="400" height="400" fill="url(#clous)" clip-path="url(#dc)"/>';
  for (var i = 0; i < 60; i++) {
    var a = i * 6 * Math.PI / 180, big = i % 5 === 0, r1 = big ? 150 : 160, r2 = 168;
    g += '<line x1="' + (200 + r1 * Math.sin(a)).toFixed(1) + '" y1="' + (200 - r1 * Math.cos(a)).toFixed(1) + '" x2="' + (200 + r2 * Math.sin(a)).toFixed(1) + '" y2="' + (200 - r2 * Math.cos(a)).toFixed(1) +
      '" stroke="' + (big ? 'url(#rg)' : 'rgba(217,168,143,.45)') + '" stroke-width="' + (big ? 4 : 1.2) + '" stroke-linecap="round"/>';
  }
  // sub-dials
  [[128, 'sp'], [272, 'fu']].forEach(function (d) {
    var cx = d[0], cy = 238;
    g += '<circle cx="' + cx + '" cy="' + cy + '" r="44" fill="rgba(0,0,0,.25)" stroke="rgba(217,168,143,.35)"/>';
    for (var k = 0; k <= 10; k++) { var aa = (-120 + k * 24) * Math.PI / 180; g += '<line x1="' + (cx + 34 * Math.sin(aa)).toFixed(1) + '" y1="' + (cy - 34 * Math.cos(aa)).toFixed(1) + '" x2="' + (cx + 40 * Math.sin(aa)).toFixed(1) + '" y2="' + (cy - 40 * Math.cos(aa)).toFixed(1) + '" stroke="rgba(217,168,143,.6)" stroke-width="' + (k % 5 ? 1 : 2) + '"/>'; }
    g += '<g id="' + d[1] + '"><line x1="' + cx + '" y1="' + cy + '" x2="' + cx + '" y2="' + (cy - 34) + '" stroke="url(#rg)" stroke-width="2.4" stroke-linecap="round"/></g><circle cx="' + cx + '" cy="' + cy + '" r="3.5" fill="url(#rg)"/>';
    g += '<text id="' + d[1] + 'T" x="' + cx + '" y="' + (cy + 26) + '" text-anchor="middle" font-family="Archivo" font-stretch="75%" font-size="13" font-weight="600" fill="#F3ECE6"></text>';
  });
  g += '<text x="200" y="128" text-anchor="middle" font-family="Archivo" font-stretch="75%" font-size="12" letter-spacing="6" fill="#D9A88F">MY DS</text>';
  g += '<text id="dateT" x="200" y="150" text-anchor="middle" font-family="Archivo" font-stretch="75%" font-size="11" letter-spacing="2" fill="rgba(243,236,230,.6)"></text>';
  // hands
  g += '<g id="hh"><path d="M196 200 L200 104 L204 200 Z" fill="url(#rg)"/></g>';
  g += '<g id="mh"><path d="M197.5 200 L200 58 L202.5 200 Z" fill="url(#rg)"/></g>';
  g += '<g id="sh"><line x1="200" y1="220" x2="200" y2="48" stroke="#E0533D" stroke-width="1.4"/></g>';
  g += '<circle cx="200" cy="200" r="7" fill="url(#rg)"/><circle cx="200" cy="200" r="2.5" fill="#0a0c16"/>';
  $('face').innerHTML = g;
})();
function rot(id, deg, cx, cy) { $(id).setAttribute('transform', 'rotate(' + deg.toFixed(2) + ' ' + (cx || 200) + ' ' + (cy || 200) + ')'); }
(function clock() {
  var d = new Date(), s = d.getSeconds() + d.getMilliseconds() / 1000, m = d.getMinutes() + s / 60, h = d.getHours() % 12 + m / 60;
  rot('hh', h * 30); rot('mh', m * 6); rot('sh', Math.floor(s) * 6);
  setTimeout(clock, 1000 - d.getMilliseconds());
})();

// ---- keys: pictograms only ----
var K = [['nav', '<path d="M21 3 3 10.5l7.5 3L14 21z"/>', 'Navigasyon'],
  ['spotify', '<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>', 'Müzik'],
  ['radio', '<rect x="2" y="8" width="20" height="13" rx="2"/><path d="M6 8l12-5"/><circle cx="8" cy="14.5" r="2.5"/><path d="M14 13h4M14 16h4"/>', 'Radyo'],
  ['aa', '<path d="M12 3 4 20l8-4 8 4z"/>', 'Android Auto', 'gold'],
  ['vehicle', '<path d="M3 15v-3l2.2-4.5A2 2 0 0 1 7 6.5h10a2 2 0 0 1 1.8 1L21 12v3"/><rect x="2.5" y="12" width="19" height="5" rx="1.5"/><path d="M5 17v2M19 17v2"/>', 'Aracım'],
  ['engine', '<path d="M3 15h4l2-3h6l2 3h4"/><path d="M8 12V9h8v3"/><path d="M10 9V6h4v3"/><circle cx="6.5" cy="17.5" r="1.5"/><circle cx="17.5" cy="17.5" r="1.5"/>', 'CataraPatara'],
  ['minimal', '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>', 'Sade ekran'],
  ['settings', '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>', 'Ayarlar']];
var hasMaps = false;
K.forEach(function (k) {
  var b = document.createElement('button'); b.className = 'key' + (k[3] ? ' ' + k[3] : ''); b.setAttribute('aria-label', k[2]);
  b.innerHTML = '<svg class="ic" viewBox="0 0 24 24">' + k[1] + '</svg>';
  b.onclick = function () { call('open', k[0] === 'nav' ? (hasMaps ? 'gmaps' : 'nav') : k[0]); };
  $('bar').appendChild(b);
});
$('play').onclick = function () { call('media', 'play'); };
$('prev').onclick = function () { call('media', 'prev'); };
$('next').onclick = function () { call('media', 'next'); };
$('watch').onclick = function () { call('open', 'minimal'); };

var artId = -1;
car.on(function (s) {
  hasMaps = !!s.hasMaps;
  var day = s.night === false; document.body.classList.toggle('day', day);
  $('dialBg').setAttribute('fill', day ? 'url(#pearl)' : 'url(#lq)');
  $('dateT').textContent = (s.date || '').toLocaleUpperCase('tr-TR');
  $('tmp').textContent = s.outdoor !== undefined ? Math.round(s.outdoor) : s.temp !== undefined ? s.temp : '--';
  $('rng').textContent = s.range ? Math.round(s.range) : '--';
  var c = s.avgL100 > 0 ? s.avgL100 : s.inst !== undefined ? s.inst : s.l100;
  $('cons').textContent = c !== undefined && c !== null ? num(c, 1) : '--';
  // sub-dials: speed 0–200, fuel 0–tank
  var v = s.gps === 'ok' ? (s.speed || 0) : 0;
  rot('sp', -120 + Math.min(200, v) / 200 * 240, 128, 238); $('spT').textContent = Math.round(v) + ' km/h';
  var tank = s.tank || 60, left = s.fuelLeft !== undefined ? s.fuelLeft : null;
  rot('fu', -120 + (left === null ? 0 : Math.min(1, left / tank)) * 240, 272, 238); $('fuT').textContent = left === null ? '— L' : Math.round(left) + ' L';
  var tun = s.tuner && s.khz;
  $('mt').textContent = tun ? (s.khz / 1000).toFixed(1).replace('.', ',') + ' MHz' : (s.title || '—');
  $('ma').textContent = tun ? (s.rdsPs || 'Radyo') : (s.artist || s.srcLabel || '');
  $('playI').innerHTML = s.playing ? '<path d="M8 5v14M16 5v14" stroke-width="2.2"/>' : '<path d="M8 5v14l11-7z"/>';
  if (s.artId !== artId) { artId = s.artId; var u = artId ? call('mediaArt') : ''; $('cover').src = u || ''; $('cover').style.visibility = u ? 'visible' : 'hidden'; }
});
</script>
</body>
</html>
