<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Aracım</title>
<link rel="stylesheet" href="common.css">
<style>
:root{--a:#5CC8B0;--bg:#0B0E13;--fg:#F3F5F7;--card:#161B23;--muted:#A3ADBA;--sep:#232A35;--chip:#1E252F}
body{background:var(--bg);color:var(--fg);font-family:'Inter',sans-serif}
.sg{font-family:'Space Grotesk',sans-serif;font-weight:700}
.r{width:100vw;height:100vh;padding:2.78vh;display:flex;gap:2.22vh}
#stage{flex:1;min-width:0;border-radius:3.33vh;overflow:hidden;position:relative;background:#000}
body.day{--bg:#EEF1F4;--fg:#11161D;--card:#FFFFFF;--muted:#56606C;--sep:#E3E8EE;--chip:#EEF1F4;--a:#1F8F78}
body.day #stage{background:#FFFFFF;box-shadow:inset 0 0 0 1px #E3E8EE}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.chip{border:none;border-radius:1.67vh;background:var(--chip);color:var(--fg);height:6.67vh;padding:0 2.22vh;font-size:2.22vh;font-weight:600;white-space:nowrap}
.chip.on{background:var(--a);color:#0B0E13}
#views{position:absolute;left:2.22vh;right:2.22vh;bottom:2.22vh;display:flex;gap:1.11vh;justify-content:center;flex-wrap:wrap}
#top{position:absolute;left:2.22vh;right:2.22vh;top:2.22vh;display:flex;align-items:center;gap:1.67vh}
.sw{width:4.72vh;height:4.72vh;border-radius:50%;border:.33vh solid rgba(255,255,255,.18);padding:0}
.sw.on{border-color:#fff}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:2.5vh}
#side{width:min(66.67vh,38vw);flex-shrink:0;display:flex;flex-direction:column;gap:2.22vh;min-height:0}
.card{border-radius:3.33vh;background:var(--card);padding:2.78vh 3.06vh}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:1.67vh;padding:1.25vh 0;border-bottom:1px solid var(--sep)}
.row:last-child{border-bottom:none}
.row span{font-size:2.08vh;color:var(--muted);white-space:nowrap}
.row b{font-size:2.64vh;font-weight:600;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ik{width:7.2vh;height:7.2vh;padding:0;display:flex;align-items:center;justify-content:center}
.ik svg{width:4.4vh;height:4.4vh;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:1.4vh}
.tile{border-radius:2.4vh;background:var(--chip);padding:1.8vh;display:flex;flex-direction:column;gap:.8vh}
.tile svg{width:3.6vh;height:3.6vh;fill:none;stroke:var(--muted);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-size:3.6vh;line-height:1;font-variant-numeric:tabular-nums}
.tile b small{font-size:1.8vh;color:var(--muted);margin-left:.5vh;font-weight:500}
/* Stock skin */
body.t-stock{--a:#E8D5B0;--bg:#050506;--card:#111214;--chip:#1a1b1f;--muted:#A8A39A;--sep:#26272B;font-family:'Montserrat',sans-serif}
body.t-stock #stage{background:radial-gradient(70% 70% at 50% 40%,#232428,#08080a 70%)}
body.t-stock .card,body.t-stock .tile,body.t-stock .chip{background:linear-gradient(180deg,rgba(32,33,36,.95),rgba(12,12,14,.95));box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),inset 0 1px 0 rgba(255,255,255,.18)}
body.t-stock .chip.on{background:linear-gradient(180deg,#f3e6cc,#cdb58b);color:#111}
body.t-stock .sg,body.t-stock .tile b{font-family:'Montserrat',sans-serif;font-style:italic;font-weight:600}
/* Panel 80 skin */
body.t-panel{--a:var(--pv,#56F2FF);--bg:#030608;--card:#0b1114;--chip:#0f181c;--muted:var(--pv2,#2a8f98);--sep:rgba(var(--pvr,86,242,255),.18);--fg:var(--pv,#56F2FF);font-family:'Share Tech Mono',monospace}
body.t-panel #stage{background:#020405;box-shadow:inset 0 0 0 1px rgba(var(--pvr,86,242,255),.22);background-image:linear-gradient(rgba(var(--pvr,86,242,255),.06) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--pvr,86,242,255),.06) 1px,transparent 1px);background-size:4vh 4vh}
body.t-panel .card,body.t-panel .tile,body.t-panel .chip{background:transparent;box-shadow:inset 0 0 0 1px rgba(var(--pvr,86,242,255),.25);color:var(--fg)}
body.t-panel .chip.on{background:rgba(var(--pvr,86,242,255),.14);color:var(--fg);box-shadow:inset 0 0 0 1px var(--a),0 0 1.6vh rgba(var(--pvr,86,242,255),.3)}
body.t-panel .sg,body.t-panel .tile b{font-family:'Share Tech Mono',monospace;font-weight:400;text-shadow:0 0 1vh rgba(var(--pvr,86,242,255),.6)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:5}
#sheet .box{width:min(110vh,92vw);max-height:92vh;overflow:auto;border-radius:3.33vh;background:var(--card);padding:3.33vh}
#sheet label{display:flex;flex-direction:column;gap:.83vh;font-size:1.94vh;color:var(--muted)}
#sheet input{height:6.67vh;border-radius:1.67vh;border:1px solid #2E3744;background:#0F141B;color:var(--fg);font-size:2.5vh;padding:0 1.94vh;font-family:inherit}
</style>
</head>
<body>
<div class="r">
<div id="stage">
<canvas id="c"></canvas>
<div id="load">Model hazırlanıyor…</div>
<div id="top">
<button class="key chip ik" id="back" aria-label="Geri"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
<div style="flex:1"></div>
<div id="colors" style="display:flex;gap:1.11vh"></div>
<button class="key chip" id="mode3d" style="height:7.2vh;padding:0 2.2vh;font-weight:600;letter-spacing:.12em" aria-label="Canlı 3D">3D</button>
<button class="key chip ik" id="homePic" aria-label="Ana ekran görseli"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg></button>
<button class="key chip ik on" id="spin" aria-label="360° dönüş"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4h-4"/></svg></button>
</div>
<div id="views"></div>
<div id="picM" style="display:none;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.66);align-items:center;justify-content:center">
  <div style="width:min(94vw,170vh);background:#17191d;box-shadow:0 2vh 6vh rgba(0,0,0,.6);border-radius:3vh;padding:3vh 3.4vh;display:flex;flex-direction:column;gap:2.4vh;color:var(--text,#fff)">
    <div style="display:flex;align-items:center;gap:1.6vh"><span style="font-size:3.4vh;font-weight:600;flex:1">Ana ekrandaki araç görseli</span><button class="key chip ik" id="picX" aria-label="Kapat"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div id="picOpts" style="display:grid;grid-template-columns:repeat(2,1fr);gap:2vh"></div>
    <div id="picMsg" style="font-size:2.2vh;opacity:.7;min-height:3vh">USB belleğe <b>arac.jpg</b> adıyla (veya MYDS klasörüne) koy, takınca kendisi gelir. Ya da galeriden seç. Sadece bu cihazda saklanır.</div>
  </div>
</div>
</div>
<div id="side">
<div class="card" style="display:flex;flex-direction:column;gap:.56vh">

<span class="sg" style="font-size:4.72vh;line-height:1.05" id="iModel">Citroën DS4</span>
<span style="font-size:2.36vh;color:var(--muted)" id="iSub">2013 · 10 KE 424</span>
<div style="display:flex;align-items:baseline;gap:1.11vh;margin-top:1.67vh"><span class="sg" style="font-size:7.22vh;line-height:1" id="odo">—</span><span style="font-size:2.5vh;color:var(--muted)">km</span></div>
<span style="display:none" id="odoNote"></span>
</div>
<div class="tiles" id="info" style="flex:1;min-height:0;align-content:start"></div>
<div style="display:flex;gap:1.67vh">
<button class="key chip ik" style="flex:1;height:8.4vh" id="edit" aria-label="Düzenle"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg></button>
<button class="key chip ik" style="flex:1;height:8.4vh" id="logs" aria-label="Bakım ve yakıt"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg></button>
<button class="key chip ik" style="flex:1;height:8.4vh;color:var(--a)" id="engine" aria-label="Motor sesi"><svg viewBox="0 0 24 24"><path d="M3 15h4l2-3h6l2 3h4"/><path d="M8 12V9h8v3"/><path d="M10 9V6h4v3"/><circle cx="6.5" cy="17.5" r="1.5"/><circle cx="17.5" cy="17.5" r="1.5"/></svg></button>
<button class="key chip ik" style="flex:1;height:8.4vh" id="obdK" aria-label="Motor verileri"><svg viewBox="0 0 24 24"><path d="M5 18a8 8 0 1 1 14 0"/><path d="M12 13l4-4"/><circle cx="12" cy="13.5" r="1.2"/></svg></button>
</div>
</div>
</div>

<div id="sheet"><div class="box">
<div class="sg" style="font-size:3.61vh;margin-bottom:2.22vh">Araç bilgileri</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:1.94vh" id="form"></div>
<div style="display:flex;gap:1.67vh;margin-top:2.78vh;justify-content:flex-end">
<button class="key chip" id="cancel">Vazgeç</button>
<button class="key chip on" id="save">Kaydet</button>
</div>
</div></div>

<script src="common.js"></script>
<script>
// Live 3D by default; studio photos when the "3D" button is switched off (or for the offline photo render).
if (store('myds.3d') !== 'photo' || location.hash === '#render')
  document.write('<script src="3d/three.min.js"><\/script><script src="3d/OrbitControls.js"><\/script><script src="3d/GLTFLoader.js"><\/script><script src="3d/RoomEnvironment.js"><\/script>');
</script>
<script>
// ---- Vehicle info (kept on the unit) ----------------------------------------------------------
var FIELDS = [['model', 'Model', 'Citroën DS4'], ['year', 'Model yılı', '2013'], ['plate', 'Plaka', '10 KE 424'],
  ['engine', 'Motor', '1.6 e-HDi'], ['fuel', 'Yakıt tipi', 'Dizel'], ['gear', 'Şanzıman', ''], ['color', 'Renk', ''],

var info = {};

function val(k) { for (var i = 0; i < FIELDS.length; i++) if (FIELDS[i][0] === k) return info[k] !== undefined && info[k] !== '' ? info[k] : FIELDS[i][2]; return ''; }
var live = {};
function fmtKm(v) { return Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }

  $('iModel').textContent = val('model');
  $('iSub').textContent = [val('year'), val('plate')].filter(Boolean).join(' · ');
  if (live.odo !== undefined) { $('odo').textContent = fmtKm(live.odo); $('odoNote').textContent = 'Girilen değer + GPS ile sürülen yol'; }
  // four icon tiles, numbers only: fuel left, range, next oil service, inspection
  var T = [
    ['<path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16"/><path d="M3 21h12"/><path d="M14 9h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V8l-3-3"/>', live.fuelLeft !== undefined ? num(live.fuelLeft, 0) : '--', 'L'],
    ['<path d="M4 20 9 4M20 20 15 4M12 6v2M12 11v2M12 16v3"/>', live.range ? Math.round(live.range) : '--', 'km'],
    ['<path d="M7 4h7l3 3v3"/><path d="M5 10h12l2 3v7H5z"/><path d="M12 13v4"/>', live.oilKm ? fmtKm(live.oilKm) : '--', 'km'],
    ['<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/><path d="M9 15l2 2 4-4"/>', live.regDate || '--', '']];
  $('info').innerHTML = T.map(function (t) {
    return '<div class="tile"><svg viewBox="0 0 24 24">' + t[0] + '</svg><b>' + String(t[1]).replace(/</g, '&lt;') + (t[2] ? '<small>' + t[2] + '</small>' : '') + '</b></div>'; }).join('');
}
(function () { var t = +(call('theme') || 7); document.body.classList.add(t === 8 ? 't-stock' : t === 4 ? 't-panel' : 't-ds4'); })();
car.on(function (s) { live = s; document.body.classList.toggle('day', s.night === false && !document.body.classList.contains('t-stock')); paintInfo(); });
paintInfo();

FIELDS.forEach(function (f) {
  var l = document.createElement('label'); l.textContent = f[1];
  var i = document.createElement('input'); i.id = 'f_' + f[0]; i.placeholder = f[2];
  if (f[0] === 'odo' || f[0] === 'year') i.inputMode = 'numeric';
  l.appendChild(i); $('form').appendChild(l);
});
$('edit').onclick = function () {
  FIELDS.forEach(function (f) { $('f_' + f[0]).value = f[0] === 'odo' ? (live.odo !== undefined ? Math.round(live.odo) : '') : (info[f[0]] || ''); });
  $('sheet').style.display = 'flex';
};
$('cancel').onclick = function () { $('sheet').style.display = 'none'; };
$('save').onclick = function () {
  FIELDS.forEach(function (f) { if (f[0] !== 'odo') info[f[0]] = $('f_' + f[0]).value.trim(); });
  store('myds.car', JSON.stringify(info));
  var km = parseFloat(($('f_odo').value || '').replace(/[.\s]/g, '').replace(',', '.'));
  if (!isNaN(km) && km >= 0 && (live.odo === undefined || Math.round(live.odo) !== Math.round(km))) call('setOdometer', km);
  $('sheet').style.display = 'none'; paintInfo();
};
$('engine').onclick = function () { call('open', 'engine'); };
$('logs').onclick = function () { call('open', 'vehicleNative'); };
$('back').onclick = function () { call('open', 'themehome'); };

// ---- 3D (WebGL), or a 360° photo spin where WebGL is missing or too slow ----------------------
var RENDER_MODE = location.hash === '#render';
// A shader that does not compile leaves the car invisible: switch to the photo spin.
(function () {
  var ce = console.error;
  console.error = function () {
    try { var m = [].join.call(arguments, ' '); if (/Shader Error|shader not compiled|VALIDATE_STATUS/i.test(m)) setTimeout(function () { fallback('shader'); }, 0); } catch (e) {}
    return ce.apply(console, arguments);
  };
})();
var VIEWS, VIEWS2 = [0, 45, 90, 135, 180, 'top'];
var VIC = {
  front: '<path d="M6 12l1.6-4.2A2 2 0 0 1 9.5 6.5h5a2 2 0 0 1 1.9 1.3L18 12"/><rect x="3.5" y="12" width="17" height="5" rx="1.6"/><circle cx="7" cy="14.5" r="1"/><circle cx="17" cy="14.5" r="1"/><path d="M10 15h4M6 17v2M18 17v2"/>',
  q3f: '<path d="M3 16v-2.5l2-1.5 2.5-3.5h7l3.5 3 2.5.8V16z"/><circle cx="7" cy="16.5" r="1.7"/><circle cx="17" cy="16.5" r="1.7"/><path d="M20.5 13.5h-1.6"/><path d="M9 9l-1 3h9"/>',
  side: '<path d="M2 15.5V13l3-1 3-3.5h7l4 3.5h2.5V15.5z"/><circle cx="6.5" cy="16" r="1.8"/><circle cx="17.5" cy="16" r="1.8"/>',
  q3r: '<path d="M21 16v-2.5l-2-1.5-2.5-3.5h-7L6 11.5l-2.5.8V16z"/><circle cx="17" cy="16.5" r="1.7"/><circle cx="7" cy="16.5" r="1.7"/><rect x="3.5" y="12.5" width="1.8" height="1.2" rx=".3"/><path d="M15 9l1 3H7"/>',
  rear: '<path d="M6 12l1.6-4.2A2 2 0 0 1 9.5 6.5h5a2 2 0 0 1 1.9 1.3L18 12"/><rect x="3.5" y="12" width="17" height="5" rx="1.6"/><rect x="5.5" y="13.4" width="2.6" height="1.4" rx=".4"/><rect x="15.9" y="13.4" width="2.6" height="1.4" rx=".4"/><path d="M6 17v2M18 17v2"/>',
  top: '<rect x="7" y="3" width="10" height="18" rx="4"/><path d="M8.5 8.5h7l-1 2.5h-5z"/><path d="M9 16.5h6"/>' };
[['Ön', 'front'], ['¾ Ön', 'q3f'], ['Yan', 'side'], ['¾ Arka', 'q3r'], ['Arka', 'rear'], ['Üst', 'top']].forEach(function (n) {
  var b = document.createElement('button'); b.className = 'key chip ik'; b.setAttribute('aria-label', n[0]);
  b.innerHTML = '<svg viewBox="0 0 24 24">' + VIC[n[1]] + '</svg>'; $('views').appendChild(b);
});
function markView(i) { var s = $('views').children; for (var k = 0; k < s.length; k++) s[k].classList.toggle('on', k === i); }
function webglOK() {
  try { var c = document.createElement('canvas'); return !!(window.WebGLRenderingContext && window.THREE && (c.getContext('webgl') || c.getContext('experimental-webgl'))); }
  catch (e) { return false; }
}
var spritesStarted = false;

  if (spritesStarted || RENDER_MODE) return;
  spritesStarted = true;
  try { if (window.__stop3d) window.__stop3d(); } catch (e) {}
  $('c').style.display = 'none';
  $('colors').style.display = 'none';
  startSprites();
}
(function () {
  var live = store('myds.3d') !== 'photo', b = $('mode3d');
  b.classList.toggle('on', live);
  b.onclick = function () { store('myds.3d', live ? 'photo' : '3d'); location.reload(); };
})();
if (!RENDER_MODE && (store('myds.3d') === 'photo' || !webglOK())) fallback('nogl');
else {
  try { init3D(); } catch (e) { fallback('error'); }
  // Still nothing on screen after 15 s (slow GPU / old WebView): use the photo spin.
  if (!RENDER_MODE) setTimeout(function () { if (!window.__shown3d) fallback('slow'); }, 15000);
}

function init3D() {
var stage = $('stage'), canvas = $('c');
var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: !RENDER_MODE ? true : true, preserveDrawingBuffer: RENDER_MODE, alpha: true });
if (!RENDER_MODE && renderer.capabilities.precision !== 'highp') throw new Error('lowp');
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.physicallyCorrectLights = true;

var scene = new THREE.Scene();

scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;

var camera = new THREE.PerspectiveCamera(32, 1, 0.05, 100);
var TARGET = new THREE.Vector3(0, 0.62, 0);
camera.position.set(-9, 3.2, 12);
var controls = new THREE.OrbitControls(camera, canvas);
controls.target.copy(TARGET);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 3.2; controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI / 2 - 0.04;
controls.rotateSpeed = 0.7;
controls.autoRotate = false; controls.autoRotateSpeed = 0.5;   // one turn ≈ 2 min

var key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(4, 7, 3); key.castShadow = true;
key.shadow.mapSize.set(1024, 1024); key.shadow.bias = -0.0005;
key.shadow.camera.left = -3.5; key.shadow.camera.right = 3.5; key.shadow.camera.top = 3.5; key.shadow.camera.bottom = -3.5;
scene.add(key);
scene.add(new THREE.HemisphereLight(0xcfdcff, 0x202020, 0.45));

var ground = new THREE.Mesh(new THREE.CircleGeometry(6, 64), new THREE.ShadowMaterial({ opacity: 0.45 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
var ring = new THREE.Mesh(new THREE.RingGeometry(2.75, 2.8, 96), new THREE.MeshBasicMaterial({ color: document.documentElement.classList.contains('noir') ? 0xffffff : 0x5CC8B0, transparent: true, opacity: 0.35 }));
ring.rotation.x = -Math.PI / 2; ring.position.y = 0.005; scene.add(ring);

var bodyMats = [], model = null;
function b64ToBuf(s) { var bin = atob(s), n = bin.length, u = new Uint8Array(n); for (var i = 0; i < n; i++) u[i] = bin.charCodeAt(i); return u.buffer; }
function loadModel() {
  if (!window.DS4_GLB) {
    if (loadModel.tried) { $('load').textContent = 'Model bulunamadı.'; return; }
    loadModel.tried = true;
    var sc = document.createElement('script'); sc.src = '3d/ds4model.js';
    sc.onload = loadModel; sc.onerror = function () { fallback('nofile'); };
    document.body.appendChild(sc);
    return;
  }
  try {
    new THREE.GLTFLoader().parse(b64ToBuf(window.DS4_GLB), '', function (gltf) {
      model = gltf.scene;
      model.traverse(function (o) {
        if (!o.isMesh) return;
        o.castShadow = true; o.receiveShadow = true;
        var ms = Array.isArray(o.material) ? o.material : [o.material];
        ms.forEach(function (m, k) {
          if (m.name === 'body') {
            var pm = new THREE.MeshPhysicalMaterial({ color: 0xf2f1ee, metalness: 0.25, roughness: 0.28, clearcoat: 1, clearcoatRoughness: 0.04, side: THREE.DoubleSide });
            pm.name = 'body';
            if (Array.isArray(o.material)) o.material[k] = pm; else o.material = pm;
            bodyMats.push(pm);
          }
          if (m.name === 'window_black') { m.envMapIntensity = 0.3; m.roughness = 0.16; }   // tinted-black glass: nothing of the cabin shows
          if (m.transparent) { m.depthWrite = false; o.castShadow = false; o.renderOrder = 2; }
        });
      });
      scene.add(model);
      setColor(parseInt(store('myds.color') || '0', 10) || 0);
      $('load').style.display = 'none';
      window.__shown3d = true;
      if (RENDER_MODE) { window.__model = model; ground.visible = true; ring.visible = false; return; }
      intro();
    }, function (err) { fallback('load'); });
  } catch (e) { fallback('parse'); }
}

// Body colours
var COLORS = [['Beyaz', 0xf2f1ee], ['Şampanya', 0x95836a], ['Siyah', 0x0c0c0e], ['Gri', 0x5a5e63], ['Kırmızı', 0x8c1018], ['Mavi', 0x1f3460]];
COLORS.forEach(function (c, i) {
  var b = document.createElement('button'); b.className = 'key sw'; b.title = c[0];
  b.style.background = '#' + ('00000' + c[1].toString(16)).slice(-6);
  b.onclick = function () { setColor(i); store('myds.color', i); };
  $('colors').appendChild(b);
});
window.__setColor = function (i) { setColor(i); };
function setColor(i) {
  bodyMats.forEach(function (m) { m.color.setHex(COLORS[i][1]); });
  var s = $('colors').children; for (var k = 0; k < s.length; k++) s[k].classList.toggle('on', k === i);
}

// ---- Camera animations --------------------------------------------------------------------------
// The car's nose points along +x. Each view: azimuth (deg, 0 = front), elevation (deg), distance.
VIEWS = [['Ön', 0, 8, 6.4], ['¾ Ön', 45, 14, 7.6], ['Yan', 90, 8, 8.2], ['¾ Arka', 135, 14, 7.6], ['Arka', 180, 8, 6.4], ['Üst', 90, 82, 9.2]];
// Narrow stages (800×480 units) need the camera further back so the whole car fits.
function fit(d) { return d * Math.max(1, 1.45 / camera.aspect); }
function sph(az, el, d) {
  var a = az * Math.PI / 180, e = el * Math.PI / 180;
  return new THREE.Vector3(Math.cos(a) * Math.cos(e) * d, Math.sin(e) * d, Math.sin(a) * Math.cos(e) * d).add(TARGET);
}
function toSph(p) {
  var v = p.clone().sub(TARGET), d = v.length();
  return { az: Math.atan2(v.z, v.x), el: Math.asin(Math.max(-1, Math.min(1, v.y / d))), d: d };
}
var tween = null;
function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function flyTo(az, el, d, ms, done) {
  d = fit(d);
  var a = toSph(camera.position), bAz = az * Math.PI / 180, bEl = el * Math.PI / 180;
  var dAz = bAz - a.az; while (dAz > Math.PI) dAz -= 2 * Math.PI; while (dAz < -Math.PI) dAz += 2 * Math.PI;
  tween = { t0: performance.now(), ms: ms, az: a.az, dAz: dAz, el: a.el, dEl: bEl - a.el, d: a.d, dD: d - a.d, done: done };
  controls.enabled = false;
}
function stepTween(now) {
  if (!tween) return;
  var t = Math.min(1, (now - tween.t0) / tween.ms), k = ease(t);
  var az = tween.az + tween.dAz * k, el = tween.el + tween.dEl * k, d = tween.d + tween.dD * k;
  camera.position.set(Math.cos(az) * Math.cos(el) * d, Math.sin(el) * d, Math.sin(az) * Math.cos(el) * d).add(TARGET);
  camera.lookAt(TARGET);
  if (t >= 1) { var cb = tween.done; tween = null; controls.enabled = true; controls.update(); if (cb) cb(); }
}
VIEWS.forEach(function (v, i) {
  $('views').children[i].onclick = function () { setSpin(false); markView(i); flyTo(v[1], v[2], v[3], 1100); };
});

// Auto 360° turn: on after the intro, paused while touching, back on after a quiet spell.
var spinWanted = store('myds.spin') !== '0', idleTimer = null;
function setSpin(on) { controls.autoRotate = on; $('spin').classList.toggle('on', on); }
$('spin').onclick = function () { spinWanted = !controls.autoRotate; store('myds.spin', spinWanted ? '1' : '0'); setSpin(spinWanted); markView(-1); };
controls.addEventListener('start', function () { clearTimeout(idleTimer); controls.autoRotate = false; markView(-1); });
controls.addEventListener('end', function () {
  clearTimeout(idleTimer);
  if (spinWanted) idleTimer = setTimeout(function () { setSpin(true); }, 8000);
});

// Entrance: the camera sweeps in from afar round the front and settles on the ¾ front view.
function intro() {
  camera.position.copy(sph(-120, 30, 13)); camera.lookAt(TARGET);
  ring.material.opacity = 0;
  flyTo(45, 14, 7.6, 2600, function () { markView(1); if (spinWanted) setTimeout(function () { if (!tween) setSpin(true); }, 1500); });
}

function resize() {
  var w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();
var stopped = false;
window.__stop3d = function () { stopped = true; };
// Frame rate guard: under ~8 fps for 4 s after the model shows, switch to the photo spin.
var slowSince = 0, lastT = 0, lastR = 0;
function loop(now) {
  if (stopped) return;
  if (window.__shown3d && !RENDER_MODE && lastT) {
    var fps = 1000 / Math.max(1, now - lastT);
    if (fps < 8) { if (!slowSince) slowSince = now; else if (now - slowSince > 4000) { fallback('fps'); return; } } else slowSince = 0;
  }
  lastT = now;
  if (now - lastR < 32) { requestAnimationFrame(loop); return; }   // 30 fps cap
  lastR = now;
  stepTween(now);
  if (!tween) controls.update();
  if (ring.material.opacity < 0.35) ring.material.opacity = Math.min(0.35, ring.material.opacity + 0.004);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
if (!RENDER_MODE) requestAnimationFrame(loop);
setTimeout(loadModel, 30);

// Offline renderer for the photo spin (desktop only, #render).
window.__render = function (az, el, d, w, h) {
  renderer.setPixelRatio(1);
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  camera.position.copy(sph(az, el, d)); camera.lookAt(TARGET);
  renderer.render(scene, camera);
  return canvas.toDataURL('image/png');
};
}

// ---- Photo spin ------------------------------------------------------------------------------------
// 36 pictures round the car (every 10°, front = 0°) plus one from above, made from the same model.
function startSprites() {
  // Studio photos: 8 angles + top, crossfading. Swipe = next/previous angle; the round arrow walks round slowly.
  var stage = $('stage'), box = document.createElement('div');
  box.style.cssText = 'position:absolute;inset:0;touch-action:none';
  stage.insertBefore(box, $('load'));
  var cp = carPhoto(box);
  [].forEach.call(box.children, function (im) { im.style.cssText += ';position:absolute;inset:0;width:100%;height:100%;object-fit:contain'; });
  $('load').style.display = 'none';
  var cr = document.createElement('div');
  cr.style.cssText = 'position:absolute;right:2vh;bottom:11vh;font-size:1.4vh;opacity:.45;pointer-events:none';
  cr.textContent = 'Fotoğraf: Vauxford · Wikimedia Commons · CC BY-SA 4.0';
  stage.appendChild(cr);
  var az = 45, sx = null, spinOn = store('myds.spin') !== '0', tour = null, idle = null;
  function go(a) { az = a; cp.show(a); }
  function setSpin2(on) { spinOn = on; $('spin').classList.toggle('on', on); clearInterval(tour); tour = null; if (on) tour = setInterval(function () { go(az + 45); markView(-1); }, 3500); }
  box.addEventListener('pointerdown', function (e) { sx = e.clientX; try { box.setPointerCapture(e.pointerId); } catch (x) {} clearTimeout(idle); clearInterval(tour); tour = null; });
  box.addEventListener('pointermove', function (e) {
    if (sx === null) return;
    var dx = e.clientX - sx, step = stage.clientWidth / 8;
    if (Math.abs(dx) > step) { go(az - Math.sign(dx) * 45); sx = e.clientX; markView(-1); }
  });
  function up() { if (sx === null) return; sx = null; if (spinOn) idle = setTimeout(function () { setSpin2(true); }, 8000); }
  box.addEventListener('pointerup', up); box.addEventListener('pointercancel', up);
  $('spin').onclick = function () { setSpin2(!spinOn); store('myds.spin', spinOn ? '1' : '0'); markView(-1); };
  var btns = $('views').children;
  VIEWS2.forEach(function (v, k) {
    btns[k].onclick = function () { setSpin2(false); markView(k); if (v === 'top') cp.show('top'); else go(v); };
  });
  cp.show(45, true); markView(1);
  if (spinOn) idle = setTimeout(function () { setSpin2(true); }, 4000);
}

try { $('obdK').onclick = function () { call('open', 'obd'); }; } catch (e) {}

// ---- picture for the home screen: real ¾ front, own side render, or the owner's photo
(function () {
  var M = $('picM'), box = $('picOpts');
  var OPTS = [['front', 'Ön ¾ fotoğraf'], ['own', 'Kendi fotoğrafım']];
  function draw() {
    var cur = homeCarSrc().mode === 'front' ? 'front' : 'own', keep = store('myds.carbg') === 'keep', own = '';
    try { own = (keep ? call('carPhotoRaw') : call('carPhotoData')) || call('carPhotoData') || ''; } catch (e) {}
    box.innerHTML = '';
    OPTS.forEach(function (o) {
      var b = document.createElement('button'), on = cur === o[0];
      b.className = 'key';
      b.style.cssText = 'display:flex;flex-direction:column;gap:1.4vh;align-items:stretch;padding:1.6vh;border-radius:2.2vh;border:.4vh solid ' + (on ? 'var(--a,#4c8dff)' : 'transparent') + ';background:rgba(255,255,255,.06);color:inherit;font-size:2.6vh';
      var src = o[0] === 'front' ? '3d/foto/real_front.webp' : own;
      b.innerHTML = '<div style="height:22vh;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25);border-radius:1.4vh;overflow:hidden">' +
        (src ? '<img src="' + src + '" style="max-width:100%;max-height:100%;object-fit:contain">' : '<span style="font-size:6vh;opacity:.5">+</span>') + '</div>' +
        '<span>' + o[1] + (o[0] === 'own' && own ? ' · değiştir' : '') + '</span>';
      b.onclick = function () {
        if (o[0] === 'own' && (!own || on)) {
          if ((car.s && car.s.speed || 0) > 5) { $('picMsg').textContent = 'Araç dururken seçebilirsin.'; return; }
          $('picMsg').textContent = 'Galeri açılıyor…'; call('carPhotoPick'); return;
        }
        store('myds.carimg', o[0]); draw();
        $('picMsg').textContent = 'Tamam. Ana ekrana dönünce görünür.';
      };
      box.appendChild(b);
    });
    if (own) {
      var rm = document.createElement('button'); rm.className = 'key chip';
      var bgB = document.createElement('button'); bgB.className = 'key chip';
      bgB.textContent = keep ? 'Arka plan: olduğu gibi' : 'Arka plan: silindi';
      bgB.style.cssText = 'grid-column:2;height:6vh;font-size:2.2vh;justify-content:center';
      bgB.onclick = function () { store('myds.carbg', keep ? 'cut' : 'keep'); draw(); };
      box.appendChild(bgB);
      rm.textContent = 'Kendi fotoğrafımı sil'; rm.style.cssText = 'grid-column:2;height:6vh;font-size:2.2vh;justify-content:center';
      rm.onclick = function () { call('carPhotoClear'); if (store('myds.carimg') === 'own') store('myds.carimg', 'front'); draw(); };
      box.appendChild(rm);
    }
  }
  window.onCarPicked = function (ok) {
    if (!ok) { $('picMsg').textContent = 'Bu resim açılamadı.'; return; }
    $('picMsg').textContent = 'Arka plan siliniyor…';
    carCutout(call('carPhotoRaw'), function (url, share) {
      if (!url || !call('carPhotoSave', url)) { $('picMsg').textContent = 'Kaydedilemedi.'; return; }
      store('myds.carimg', 'own'); draw();
      $('picMsg').textContent = share > 0.97 || share < 0.04 ? 'Arka plan ayrılamadı, fotoğraf olduğu gibi kullanılıyor.' : 'Hazır. Ana ekrana dönünce görünür.';
    });
  };
  $('homePic').onclick = function () { M.style.display = 'flex'; draw(); };
  if (ownCarPending(draw)) $('picMsg').textContent = 'USB\'deki fotoğraf hazırlanıyor…';
  $('picX').onclick = function () { M.style.display = 'none'; };
})();
</script>
