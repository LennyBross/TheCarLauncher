<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>DS4+</title>
<link rel="stylesheet" href="common.css">
<style>
:root{--a:#5CC8B0;--as:rgba(92,200,176,.15);--bg:#0B0E13;--fg:#F3F5F7;--card:#161B23;--muted:#A3ADBA;--track:#262D38;--stage:#000}
body.day{--bg:#EEF1F4;--fg:#11161D;--card:#FFFFFF;--muted:#56606C;--track:#E3E8EE;--a:#1F8F78;--as:rgba(31,143,120,.14);--stage:#FFFFFF}
body{background:var(--bg);color:var(--fg);font-family:'Inter',sans-serif;transition:background .3s,color .3s}
.r{width:100vw;height:100vh;padding:2.78vh;display:flex;flex-direction:column;gap:2.22vh}
.sg{font-family:'Space Grotesk',sans-serif;font-weight:700}
.c{border-radius:3.89vh;background:var(--card)}
.half{flex:1;min-width:0;display:flex;flex-direction:column;gap:2.22vh}
.seg{display:flex;gap:.83vh;background:var(--track);border-radius:2.22vh;padding:.69vh}
.seg button{flex:1;border:none;border-radius:1.67vh;background:transparent;color:var(--muted);height:6.11vh;font-size:2.22vh;font-weight:600;font-family:inherit}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 .28vh .83vh rgba(0,0,0,.25)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5.56vh;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:1.67vh;border-radius:.83vh;background:linear-gradient(90deg,var(--a) var(--p,60%),var(--track) var(--p,60%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:5vh;height:5vh;margin-top:-1.67vh;border-radius:50%;background:#fff;box-shadow:0 .28vh 1.11vh rgba(0,0,0,.4)}
/* Engine-sound control: a quiet glass disc with a thin live rpm ring (no red racing button) */
#start{position:relative;width:min(30vh,26vw);height:min(30vh,26vw);border:none;border-radius:50%;padding:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
#start svg.rg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(135deg)}
#start .trk{fill:none;stroke:var(--track);stroke-width:2.2;stroke-linecap:round}
#start .arc{fill:none;stroke:var(--a);stroke-width:2.6;stroke-linecap:round;transition:stroke-dasharray .12s linear;filter:drop-shadow(0 0 .8vh var(--a))}
#start .cap{position:absolute;inset:16%;border-radius:50%;background:radial-gradient(circle at 50% 28%,rgba(255,255,255,.14),rgba(255,255,255,.02) 60%),var(--card);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.10),0 1.4vh 3vh rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6vh;color:var(--muted);transition:transform .08s,color .3s,box-shadow .3s}
#start .cap svg{width:38%;height:38%}
#start .cap b{font-family:'Space Grotesk',sans-serif;font-size:2.4vh;color:var(--fg);font-variant-numeric:tabular-nums;min-height:2.6vh}
#start.down .cap{transform:scale(.96)}
#start.on .cap{color:var(--a);box-shadow:inset 0 0 0 1px var(--a),0 0 3vh rgba(92,200,176,.25),0 1.4vh 3vh rgba(0,0,0,.35)}
.dock{height:11.11vh;border-radius:3.33vh;background:var(--card);display:flex;align-items:center;justify-content:space-between;padding:0 1.67vh;flex-shrink:0;gap:.56vh}
.db{flex:1;height:9.44vh;border:none;border-radius:2.22vh;background:transparent;color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.56vh;font-family:inherit}
.db i{width:7vh;height:7vh;border-radius:2vh;display:flex;align-items:center;justify-content:center}
.db i svg{width:3.9vh;height:3.9vh}
.db span{font-size:1.67vh;color:var(--muted);white-space:nowrap}
#carBox{position:relative;flex:1;min-height:0;border-radius:3.89vh;background:var(--stage);overflow:hidden;border:none;padding:0}
body.day #carBox{box-shadow:inset 0 0 0 1px #E3E8EE}
</style>
</head>
<body>
<div class="r">
<div style="flex:1;min-height:0;display:flex;gap:2.22vh">

<!-- Left half: time, light, day/night, CataraPatara start -->
<div class="half">
<div class="c" style="padding:2.78vh 3.33vh;display:flex;flex-direction:column">
<span class="sg" style="font-size:9.44vh;line-height:1;letter-spacing:-.3vh" id="clock">--:--</span><span style="font-size:2.5vh;color:var(--muted)" id="date"></span>
</div>
<div class="c" style="flex:1;min-height:0;padding:2.5vh 3.33vh;display:flex;gap:3.33vh;align-items:center">
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2.22vh">
<div style="display:flex;align-items:center;gap:1.39vh"><svg style="width:4.17vh;height:4.17vh;flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span style="font-size:2.36vh;font-weight:600;flex:1">Ekran ışığı</span><span class="sg" style="font-size:2.64vh" id="briT">100</span></div>
<input type="range" min="10" max="100" step="5" id="bri">
<div class="seg" id="mode"><button data-m="day">Gündüz</button><button data-m="auto">Oto</button><button data-m="night">Gece</button></div>
</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:1.39vh">
<button id="start" aria-label="CataraPatara motor sesi"><svg class="rg" viewBox="0 0 100 100"><circle class="trk" cx="50" cy="50" r="46" stroke-dasharray="216.8 400"/><circle class="arc" id="stArc" cx="50" cy="50" r="46" stroke-dasharray="0 400"/></svg><span class="cap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15h4l2-3h6l2 3h4"/><path d="M8 12V9h8v3"/><path d="M10 9V6h4v3"/><circle cx="6.5" cy="17.5" r="1.5"/><circle cx="17.5" cy="17.5" r="1.5"/></svg><b id="stRpm"></b></span></button>
<div style="display:flex;flex-direction:column;align-items:center"><span class="sg" style="font-size:2.36vh;color:var(--a)">CataraPatara</span><span style="font-size:1.81vh;color:var(--muted)" id="cpInfo">Motor sesi kapalı</span></div>
</div>
</div>
</div>

<!-- Right half: weather, fuel, the car -->
<div class="half">
<div style="display:flex;gap:2.22vh">
<div class="c" style="flex:0 0 36%;padding:2.5vh 2.78vh;display:flex;align-items:center;gap:1.67vh">
<svg style="width:6.11vh;height:6.11vh;flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="var(--a)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H8a5 5 0 1 1 1-9.9A6 6 0 0 1 20 11a4 4 0 0 1-2.5 8z"/></svg>
<div style="display:flex;flex-direction:column;min-width:0"><span class="sg" style="font-size:4.72vh;line-height:1" id="temp">—</span><span style="font-size:1.81vh;color:var(--muted);white-space:nowrap" id="tempLab">Hava durumu</span></div>
</div>
<div class="c" style="flex:1;min-width:0;padding:2.22vh 2.78vh;display:flex;flex-direction:column;gap:1.25vh">
<div style="display:flex;align-items:center;gap:1.39vh"><svg id="fuelIcon" style="width:3.61vh;height:3.61vh;color:var(--a)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 22V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v17"/><line x1="2" y1="22" x2="15" y2="22"/><line x1="6" y1="8" x2="11" y2="8"/><path d="M14 10h2a2 2 0 0 1 2 2v4a1.5 1.5 0 0 0 3 0V8l-3-3"/></svg><span style="font-size:2.08vh;color:var(--muted);flex:1">Yakıt</span><span class="sg" style="font-size:3.33vh;color:var(--a)" id="pct">—</span></div>
<div style="height:1.39vh;border-radius:.7vh;background:var(--track);overflow:hidden"><div id="bar" style="height:100%;width:0;background:var(--a);transition:width .4s"></div></div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1vh">
<div style="display:flex;flex-direction:column"><span style="font-size:2.5vh;font-weight:600" id="liters">— L</span><span style="font-size:1.67vh;color:var(--muted)">Depoda</span></div>
<div style="display:flex;flex-direction:column"><span style="font-size:2.5vh;font-weight:600" id="cons">—</span><span style="font-size:1.67vh;color:var(--muted)" id="consLab">L/100 km</span></div>
<div style="display:flex;flex-direction:column"><span style="font-size:2.5vh;font-weight:600" id="price">—</span><span style="font-size:1.67vh;color:var(--muted)">₺ / litre</span></div>
<div style="display:flex;flex-direction:column"><span style="font-size:2.5vh;font-weight:600" id="eco">—</span><span style="font-size:1.67vh;color:var(--muted)">Eko puan</span></div>
</div>
</div>
</div>
<button id="carBox" class="key" aria-label="Aracım">
<img id="carSpin" alt="" src="3d/home/h06.webp" style="position:absolute;left:-9%;top:2%;width:118%;height:112%;object-fit:contain;pointer-events:none">
<span style="position:absolute;left:3.33vh;top:2.78vh;display:flex;flex-direction:column;align-items:flex-start"><span class="sg" style="font-size:3.06vh;color:var(--fg)">Citroën DS4</span><span style="font-size:1.94vh;color:var(--muted)">10 KE 424 · 3D ve bilgiler</span></span>
</button>
</div>
</div>

<!-- Bottom: the buttons -->
<div class="dock" id="dock"></div>
</div>
<script src="common.js"></script>
<script>
var IC = {
  home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  map: '<path d="M12 22s7-6.1 7-12a7 7 0 1 0-14 0c0 5.9 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/>',
  sp: '<circle cx="12" cy="12" r="9"/><path d="M8 10c2.5-1 5.5-1 8 .5"/><path d="M8.5 13c2-.7 4.5-.6 6.5.6"/><path d="M9 15.8c1.6-.5 3.3-.4 4.8.4"/>',
  ytm: '<circle cx="12" cy="12" r="9"/><polygon points="10 8.5 15.5 12 10 15.5 10 8.5" fill="#fff"/>',
  aa: '<rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M10 18h4"/><path d="M9.5 9.5l2.5-2.5 2.5 2.5M12 7v6"/>',
  rad: '<rect x="2" y="8" width="20" height="13" rx="2"/><path d="M6 8l12-5"/><circle cx="8" cy="14.5" r="2.5"/><path d="M14 13h4M14 16h4"/>',
  tel: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
  drv: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  apps: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  set: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>'
};
[['Haritalar', 'map', '#2F80ED', 'gmaps'], ['Müzik', 'sp', '#1F9D55', 'spotify'], ['Android Auto', 'aa', '#5A6B85', 'aa'],
 ['Radyo', 'rad', '#C98A3A', 'radio'], ['Sade ekran', 'drv', '#2C9C84', 'minimal'], ['Ayarlar', 'set', '#4A5566', 'settings']]
.forEach(function (a) {
  var b = document.createElement('button'); b.className = 'key db';
  b.setAttribute('aria-label', a[0]);
  b.innerHTML = '<i style="background:' + a[2] + '"><svg viewBox="0 0 24 24" fill="none" stroke="' + (a[4] || '#fff') + '" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + IC[a[1]] + '</svg></i>';
  b.onclick = function () { if (a[3]) call('open', a[3]); };
  $('dock').appendChild(b);
});
$('carBox').onclick = function () { call('open', 'vehicle'); };

// Screen light and day / night
var bri = $('bri');
function paintBri(v) { $('briT').textContent = v; bri.style.setProperty('--p', ((v - 10) / 90 * 100) + '%'); }
var b0 = call('brightness'); bri.value = b0 === undefined ? 100 : b0; paintBri(+bri.value);
var briTimer = null;
bri.oninput = function () { var v = +bri.value; paintBri(v); clearTimeout(briTimer); briTimer = setTimeout(function () { call('setBrightness', v); }, 120); };
function paintMode(m) { var bs = $('mode').children; for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('on', bs[i].getAttribute('data-m') === m); }
var dm = call('dayMode'); paintMode(dm === 1 ? 'night' : dm === 2 ? 'day' : 'auto');
[].forEach.call($('mode').children, function (b) {
  b.onclick = function () {
    var m = b.getAttribute('data-m'); paintMode(m);
    if (m === 'auto') call('setAutoNight'); else call('setNight', m === 'night');
  };
});

// CataraPatara: racing start button (tap = engine sound on/off, hold = open the app)
var hasCp = false, st = $('start'), held = false, ht = null;
st.addEventListener('pointerdown', function () { st.classList.add('down'); held = false; ht = setTimeout(function () { held = true; call('open', 'engine'); }, 700); });
['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { st.addEventListener(ev, function () { st.classList.remove('down'); clearTimeout(ht); }); });
st.onclick = function () { if (held) return; if (hasCp) { st.classList.toggle('on'); call('open', 'cpToggle'); } else call('open', 'engine'); };

// The car turns round once, smoothly, and stays in the high ¾ front view.
(function () {
  var N = 48, REST = 6, pics = [], ready = 0, el = $('carSpin');
  for (var i = 0; i < N; i++) { var im = new Image(); im.onload = function () { if (++ready === N) spin(); }; im.src = '3d/home/h' + ('0' + i).slice(-2) + '.webp'; pics.push(im); }
  function spin() {
    var t0 = 0, last = -1;
    function frame(t) {
      if (!t0) t0 = t;
      var u = Math.min(1, (t - t0) / 2800), e = u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
      var k = (REST + Math.round(e * N)) % N;
      if (k !== last) { last = k; el.src = pics[k].src; }
      if (u < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
})();

car.on(function (s) {
  document.body.classList.toggle('day', !s.night);
  $('clock').textContent = s.time || '--:--';
  $('date').textContent = s.date || '';
  var out = s.outdoor !== undefined;
  $('temp').textContent = out ? Math.round(s.outdoor) + '°C' : (s.temp !== undefined ? s.temp + '°C' : '—');
  $('tempLab').textContent = out ? 'Dış sıcaklık · araç' : 'Hava durumu';
  var pct = s.fuelLeft !== undefined && s.tank ? Math.round(s.fuelLeft / s.tank * 100) : null;
  var low = pct !== null && pct <= 15, col = low ? '#F2994A' : 'var(--a)';
  $('pct').textContent = pct === null ? '—' : '%' + pct; $('pct').style.color = col;
  $('bar').style.width = (pct || 0) + '%'; $('bar').style.background = col;
  $('fuelIcon').style.color = col;
  $('liters').textContent = s.fuelLeft !== undefined ? num(s.fuelLeft, 1) + ' L' : '— L';
  var live = s.inst !== undefined;
  $('cons').textContent = num(live ? s.inst : s.l100, 1);
  var ec = eco.feed(s); $('eco').textContent = ec; $('eco').style.color = ec >= 80 ? 'var(--a)' : ec >= 60 ? '#E0A030' : '#E05040';
  $('consLab').textContent = live ? 'Anlık L/100' : 'L/100 km';
  $('price').textContent = num(s.price, 2);
  hasCp = !!s.cp;
  var on = !!s.cpOn;
  st.classList.toggle('on', on);
  var red = s.cpRed || 6500, rr = on && s.cpRpm ? Math.min(1, s.cpRpm / red) : 0;
  $('stArc').setAttribute('stroke-dasharray', (rr * 216.8).toFixed(1) + ' 400');
  $('stRpm').textContent = on && s.cpRpm ? s.cpRpm : '';
  $('cpInfo').textContent = !hasCp ? 'Kurmak için dokun' : on ? (s.cpName || 'Motor') + (s.cpRpm ? ' · ' + s.cpRpm + ' d/d' : '') : 'Motor sesi kapalı';
});
</script>
</body>
</html>
