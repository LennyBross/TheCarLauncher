<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta id="stockcss">
<title>Stock</title>
<link rel="stylesheet" href="common.css">
<style>
:root{--fg:#EEEAE2;--mut:#A8A39A;--gold:#E8D5B0;--line:rgba(255,255,255,.13)}
html,body{background:#000}
body{font-family:'Montserrat',sans-serif;color:var(--fg)}
#app{--dx:0px;position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;
  background:radial-gradient(70% 60% at 50% 42%,#1b1c1f 0%,#0b0b0d 55%,#040405 100%)}
#app::after{content:'';position:absolute;inset:6px;border-radius:26px;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),inset 0 0 40px rgba(0,0,0,.8)}
.it{font-style:italic}
.ab{position:absolute}
svg.ic{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
button{background:none;border:none;padding:0;color:inherit}

/* left rail */
#rail{left:0;top:0;width:100px;height:720px;border-right:1px solid rgba(255,255,255,.08);
  background:linear-gradient(90deg,#0a0a0c,#111215)}
#rail::after{content:'';position:absolute;right:-1px;top:110px;bottom:110px;width:1px;background:linear-gradient(transparent,rgba(232,213,176,.35),transparent)}
#rail button{position:absolute;left:24px;width:52px;height:52px;display:flex;align-items:center;justify-content:center;color:#DDD8CF;border-radius:14px}
#rail button svg{width:34px;height:34px}
#rail button:active{background:rgba(232,213,176,.12)}
#rail #pw.on{color:#ff4a3f;filter:drop-shadow(0 0 6px rgba(255,60,40,.9))}

/* header */
#hdr{left:100px;top:0;width:calc(1180px + 2 * var(--dx));height:100px}
#temp{left:36px;top:46px;font-size:34px;font-weight:600;letter-spacing:-.5px}
#tempL{left:126px;top:58px;font-size:18px;color:#D8D3CA}
#logo{left:calc(519px + var(--dx));top:3px;height:50px;width:auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
#stat{right:36px;top:44px;display:flex;align-items:center;gap:22px}
#clock{font-size:38px;font-weight:600;letter-spacing:-.5px}
#net{font-size:17px;color:#D8D3CA;display:flex;align-items:center;gap:7px}

/* side panels */
.pan{top:142px;width:450px;height:316px;border-radius:44px;
  background:linear-gradient(180deg,rgba(28,29,32,.92),rgba(10,10,12,.92));
  box-shadow:inset 0 0 0 1px var(--line),inset 0 1px 0 rgba(255,255,255,.18),0 18px 40px rgba(0,0,0,.6)}
#pl{left:116px;width:calc(450px + var(--dx))}
#pr{left:calc(806px + var(--dx));width:calc(450px + var(--dx))}
.ph{position:absolute;top:22px;font-size:25px;font-style:italic;font-weight:600;color:#F2EEE6;letter-spacing:.3px}
.ph::after{content:'';position:absolute;left:-40px;right:-230px;top:44px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22) 30%,rgba(255,255,255,.05))}
#pl .ph{left:58px}
#pr .ph{left:100px}
#pr .ph::after{left:-230px;right:-40px;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.22) 70%,transparent)}
.row{position:absolute;left:26px;width:310px;height:76px;display:flex;align-items:center;gap:18px}
.row svg{width:42px;height:42px;flex-shrink:0;color:#E4DFD6}
.row b{font-size:36px;font-weight:600;font-style:italic;letter-spacing:-.5px;line-height:1}
.row b small{font-size:21px;font-weight:500;margin-left:6px;letter-spacing:0}
.row span{display:block;font-size:17px;color:#CFCAC1;margin-top:4px}
.row+.row::before{content:'';position:absolute;left:-10px;right:-60px;top:-6px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.16) 25%,rgba(255,255,255,.04))}
#consL{max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#r1{top:82px}#r2{top:162px}#r3{top:242px}

/* media */
#cover{left:100px;top:86px;width:100px;height:100px;border-radius:6px;object-fit:cover;background:linear-gradient(135deg,#2a2b2f,#121316);
  box-shadow:0 6px 16px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.12)}
#noart{left:100px;top:86px;width:100px;height:100px;display:flex;align-items:center;justify-content:center;color:#6d6a64;pointer-events:none}
#mt{left:216px;top:96px;width:212px;font-size:26px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ma{left:216px;top:134px;width:212px;font-size:19px;color:#B7B2A9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#msrc{left:216px;top:164px;font-size:13px;letter-spacing:2px;color:#8f8a80;text-transform:uppercase}
#ecoB{left:250px;top:52px;height:30px;padding:0 14px;border-radius:15px;font-size:14px;letter-spacing:1px;color:#D8D3CA;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);display:flex;align-items:center;gap:8px}
#ecoB b{font-size:17px;font-style:italic;color:#E8D5B0}
#eqB{right:124px;top:24px;height:30px;padding:0 14px;border-radius:15px;font-size:14px;letter-spacing:1px;color:#D8D3CA;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
#radioB{right:30px;top:24px;height:30px;padding:0 14px;border-radius:15px;font-size:14px;letter-spacing:1px;color:#D8D3CA;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
#bar{left:100px;top:212px;width:calc(320px + var(--dx));height:3px;border-radius:2px;background:rgba(255,255,255,.28)}
#barf{position:absolute;left:0;top:0;height:3px;border-radius:2px;width:0;background:#F4EBDB;box-shadow:0 0 8px rgba(255,240,215,.9)}
#t1,#t2{top:224px;font-size:18px;color:#DCD7CE}
#t1{left:100px}#t2{right:30px}
#ctl{left:150px;top:236px;width:230px;height:70px;display:flex;align-items:center;justify-content:space-between}
#ctl button{width:62px;height:62px;display:flex;align-items:center;justify-content:center;border-radius:50%}
#ctl button svg{width:34px;height:34px}
#play{box-shadow:0 0 0 2px #E2CFA8,0 0 14px rgba(226,207,168,.35),inset 0 0 12px rgba(226,207,168,.15)}
#ctl button:active{background:rgba(232,213,176,.12)}

/* dial */
#dial{left:calc(387px + var(--dx));top:55px;width:506px;height:506px}
#needle{transform-origin:230px 230px;transition:transform .9s cubic-bezier(.3,.9,.3,1)}
#car{left:calc(387px + var(--dx));top:165px;width:506px;height:297px;touch-action:none}
#car canvas,#car img{position:absolute;left:0;top:0;width:100%;height:100%}
#car img{display:none;object-fit:contain}
#dots{left:calc(610px + var(--dx));top:527px;width:60px;height:14px;display:flex;justify-content:space-between}
#dots button{width:12px;height:12px;border-radius:50%;background:#77736c;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
#dots button.on{background:#F3EEE4;box-shadow:0 0 6px rgba(255,245,225,.8)}
#dots::before{content:'';position:absolute;left:-20px;right:-20px;top:-18px;bottom:-14px}

/* bottom buttons */
#btns{left:118px;top:566px;width:calc(1140px + 2 * var(--dx));height:118px;display:flex;gap:10px}
.bt{flex:1;min-width:0;position:relative;height:118px;transform:skewX(-14deg);border-radius:14px;
  background:linear-gradient(180deg,rgba(36,37,41,.95),rgba(12,12,14,.95));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),inset 0 1px 0 rgba(255,255,255,.22),0 10px 24px rgba(0,0,0,.55)}
.bt>div{transform:skewX(14deg);height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden}
.bt svg{width:40px;height:40px;color:#F1EDE5}
.bt span{font-size:17px;font-style:italic;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:#F1EDE5;white-space:nowrap;max-width:100%;padding:0 10px;box-sizing:border-box}
.bt.hi,.bt:active{box-shadow:inset 0 0 0 1px rgba(240,222,186,.55),inset 0 2px 0 rgba(255,236,200,.85),0 -2px 18px rgba(240,215,170,.25),0 10px 24px rgba(0,0,0,.55);
  background:linear-gradient(180deg,rgba(54,52,48,.95),rgba(14,14,16,.95))}
.bt.hi::before,.bt:active::before{content:'';position:absolute;left:12%;right:12%;top:-1px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#fff3dc,transparent);filter:blur(.5px)}
#load{left:calc(540px + var(--dx));top:304px;width:200px;text-align:center;font-size:14px;color:#77736c;letter-spacing:2px}

/* ---- lighting: Gündüz (light), Gece (default), Karanlık yol (dimmed for unlit roads) ---- */
#app{transition:filter .4s,background .4s}
#lightB{display:flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:16px;font-size:14px;letter-spacing:1px;color:#D8D3CA;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
#lightB svg{width:18px;height:18px}
#lightM{right:30px;top:86px;display:none;flex-direction:column;gap:6px;padding:10px;border-radius:18px;z-index:20;
  background:linear-gradient(180deg,rgba(32,33,36,.98),rgba(12,12,14,.98));box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 18px 40px rgba(0,0,0,.6)}
#lightM.on{display:flex}
#lightM button{display:flex;align-items:center;gap:12px;width:230px;height:52px;padding:0 14px;border-radius:12px;font-size:17px;font-style:italic;color:#E9E5DC;text-align:left}
#lightM button small{display:block;font-size:12px;color:#8f8a80;font-style:normal}
#lightM button.on{background:linear-gradient(180deg,#f3e6cc,#cdb58b);color:#111}#lightM button.on small{color:#3a332a}
#lightM svg{width:22px;height:22px;flex-shrink:0}
#app.L-dark{filter:brightness(.52) saturate(.8)}
#app.L-day{background:radial-gradient(70% 60% at 50% 42%,#f7f5f1 0%,#e4e1db 55%,#cfcbc4 100%);--fg:#1c1c1f;color:#1c1c1f}
#app.L-day::after{box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),inset 0 0 40px rgba(0,0,0,.08)}
#app.L-day #rail{background:linear-gradient(90deg,#e6e3de,#f2f0ec);border-right-color:rgba(0,0,0,.08)}
#app.L-day #rail button,#app.L-day #tempL,#app.L-day #net,#app.L-day .row svg,#app.L-day .ph{color:#2a2a2d}
#app.L-day .row span,#app.L-day #ma,#app.L-day #t1,#app.L-day #t2{color:#5b5750}
#app.L-day .pan{background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(238,235,230,.96));box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),inset 0 1px 0 #fff,0 14px 34px rgba(0,0,0,.14)}
#app.L-day .ph::after,#app.L-day .row+.row::before{background:linear-gradient(90deg,transparent,rgba(0,0,0,.14) 30%,rgba(0,0,0,.03))}
#app.L-day .bt{background:linear-gradient(180deg,#ffffff,#e8e5e0);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),inset 0 1px 0 #fff,0 10px 22px rgba(0,0,0,.14)}
#app.L-day .bt svg,#app.L-day .bt span{color:#1f1f22}
#app.L-day .bt.hi{background:linear-gradient(180deg,#fff7e8,#eadcc0);box-shadow:inset 0 0 0 1px rgba(150,120,70,.45),0 10px 22px rgba(0,0,0,.14)}
#app.L-day #bar{background:rgba(0,0,0,.15)}#app.L-day #barf{background:#8a6a3a;box-shadow:none}
#app.L-day #play{box-shadow:0 0 0 2px #9c7c48}
#app.L-day #radioB,#app.L-day #eqB,#app.L-day #ecoB,#app.L-day #lightB{color:#2a2a2d;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
#app.L-day #ecoB b{color:#7a5a2a !important}
#srcM{left:calc(806px + var(--dx));top:150px;width:330px;display:none;flex-direction:column;gap:6px;padding:10px;border-radius:18px;z-index:21;
  background:linear-gradient(180deg,rgba(32,33,36,.98),rgba(12,12,14,.98));box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 18px 40px rgba(0,0,0,.6)}
#srcM.on{display:flex}
#srcM .it2{display:flex;align-items:center;gap:8px}
#srcM .it2>button:first-child{flex:1;display:flex;align-items:center;gap:12px;height:54px;padding:0 14px;border-radius:12px;font-size:18px;font-style:italic;color:#E9E5DC;text-align:left}
#srcM .it2>button.on{background:linear-gradient(180deg,#f3e6cc,#cdb58b);color:#111}
#srcM .it2 .op{width:54px;height:54px;border-radius:12px;color:#A8A39A;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);font-size:20px}
#srcM .hint{font-size:12px;color:#8f8a80;padding:4px 6px 0}
</style>
</head>
<body>
<div id="app">

<!-- header frame -->
<svg class="ab" style="left:var(--dx);top:0;overflow:visible" width="1280" height="140" viewBox="0 0 1280 140">
 <defs>
  <linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".25" stop-color="#fff" stop-opacity=".28"/><stop offset=".5" stop-color="#fff" stop-opacity=".12"/><stop offset=".75" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="hf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#131316"/><stop offset="1" stop-color="#0a0a0c" stop-opacity="0"/></linearGradient>
 </defs>
 <path d="M-500 96 H420 C470 96 470 52 530 52 H750 C810 52 810 96 860 96 H1800" fill="none" stroke="url(#hl)" stroke-width="1.4"/>
 <path d="M420 96 C470 96 470 52 530 52 H750 C810 52 810 96 860 96 Z" fill="url(#hf)" opacity=".6"/>
</svg>

<div id="rail" class="ab">
 <button id="pw" style="top:104px" title="CataraPatara"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></button>
 <button data-go="themehome" style="top:181px"><svg class="ic" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/></svg></button>
 <button id="back" style="top:258px"><svg class="ic" viewBox="0 0 24 24"><path d="M8 4 4 8l4 4"/><path d="M4 8h10a6 6 0 0 1 0 12H9"/></svg></button>
 <button data-go="srcPick" style="top:335px"><svg class="ic" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg></button>
 <button data-go="nav" style="top:412px"><svg class="ic" viewBox="0 0 24 24"><path d="M21 3 3 10.5l7.5 3L14 21z"/></svg></button>
 <button data-go="phone" style="top:489px"><svg class="ic" viewBox="0 0 24 24"><path d="M5 3h3.5l1.8 4.5-2.3 1.4a11 11 0 0 0 7.1 7.1l1.4-2.3L21 15.5V19a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg></button>
 <button data-go="apps" style="top:566px"><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1"/></svg></button>
</div>

<div id="hdr" class="ab">
 <div id="temp" class="ab it">--°C</div>
 <div id="tempL" class="ab it">Dış sıcaklık</div>
 <div id="ecoB" class="ab it">EKO <b id="eco">--</b></div>
 <img id="logo" class="ab" src="ds-logo.png" alt="DS">
 <div id="stat" class="ab">
  <button id="lightB" class="it"><svg id="lightI" class="ic" viewBox="0 0 24 24"></svg><span id="lightT">OTO</span></button>
  <svg id="bt" class="ic" style="width:26px;height:26px" viewBox="0 0 24 24"><path d="m7 7 10 10-5 4V3l5 4L7 17"/></svg>
  <div id="net"><svg id="bars" viewBox="0 0 24 24" style="width:26px;height:26px" fill="currentColor"><rect x="3" y="15" width="3" height="6" rx=".6"/><rect x="8" y="11" width="3" height="10" rx=".6"/><rect x="13" y="7" width="3" height="14" rx=".6"/><rect x="18" y="3" width="3" height="18" rx=".6"/></svg><span id="netT">4G</span></div>
  <div id="clock" class="it">--:--</div>
 </div>
</div>

<div id="lightM" class="ab"></div>
<div id="srcM" class="ab"></div>
<!-- Sürüş bilgileri -->
<div id="pl" class="ab pan">
 <div class="ph">Sürüş Bilgileri</div>
 <div id="r1" class="row"><svg class="ic" viewBox="0 0 24 24"><path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16"/><path d="M3 21h12"/><path d="M6.5 7h5v4h-5z"/><path d="M14 9h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V8l-3-3"/></svg><div><b id="range">--<small>km</small></b><span>Menzil</span></div></div>
 <div id="r2" class="row"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><path d="M4 20 20 4"/></svg><div><b id="cons">--<small>L/100 km</small></b><span id="consL">Ortalama Tüketim</span></div></div>
 <div id="r3" class="row"><svg class="ic" viewBox="0 0 24 24"><path d="M3.5 17a9 9 0 1 1 17 0"/><path d="m12 13 4-4"/><circle cx="12" cy="13.5" r="1.2"/><path d="M6.5 13.5h1M12 7.5v1M16.5 13.5h1"/></svg><div><b id="avg">--<small>km/h</small></b><span>Ortalama Hız</span></div></div>
</div>

<!-- Medya -->
<div id="pr" class="ab pan">
 <div class="ph">Medya</div>
 <button id="eqB" class="ab it">EQ</button>
 <button id="radioB" class="ab it">RADYO</button>
 <img id="cover" class="ab" alt="">
 <div id="noart" class="ab"><svg class="ic" style="width:46px;height:46px" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg></div>
 <div id="mt" class="ab">Çalan bir şey yok</div>
 <div id="ma" class="ab"></div>
 <div id="msrc" class="ab"></div>
 <div id="bar" class="ab"><div id="barf"></div></div>
 <div id="t1" class="ab">0:00</div><div id="t2" class="ab">0:00</div>
 <div id="ctl" class="ab">
  <button id="prev"><svg class="ic" viewBox="0 0 24 24"><path d="M6 5v14"/><path d="M19 5 9 12l10 7z"/></svg></button>
  <button id="play"><svg id="playI" class="ic" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
  <button id="next"><svg class="ic" viewBox="0 0 24 24"><path d="M18 5v14"/><path d="M5 5l10 7-10 7z"/></svg></button>
 </div>
</div>

<!-- centre: speed dial with the 3D DS4 inside -->
<svg id="dial" class="ab" viewBox="0 0 460 460">
 <defs>
  <radialGradient id="face" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#2a2b2f"/><stop offset=".6" stop-color="#121215"/><stop offset="1" stop-color="#050506"/></radialGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f1e7"/><stop offset=".3" stop-color="#5b5852"/><stop offset=".55" stop-color="#2a2928"/><stop offset=".8" stop-color="#77736b"/><stop offset="1" stop-color="#d9d2c4"/></linearGradient>
  <linearGradient id="nd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5a4a"/><stop offset="1" stop-color="#9c0d0a"/></linearGradient>
 </defs>
 <circle cx="230" cy="230" r="228" fill="#08080a"/>
 <circle cx="230" cy="230" r="226" fill="none" stroke="url(#rim)" stroke-width="3"/>
 <circle cx="230" cy="230" r="219" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
 <path id="arc" fill="none" stroke="#E8D5B0" stroke-width="3" stroke-linecap="round" opacity=".55"/>
 <g id="ticks"></g>
 <circle cx="230" cy="230" r="166" fill="url(#face)"/>
 <circle cx="230" cy="230" r="166" fill="none" stroke="url(#rim)" stroke-width="3"/>
 <circle cx="230" cy="230" r="160" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="1"/>
 <ellipse cx="230" cy="352" rx="120" ry="16" fill="rgba(255,255,255,.04)"/>
 <text x="230" y="118" text-anchor="middle" font-family="Montserrat" font-style="italic" font-weight="500" font-size="25" letter-spacing="5" fill="#E9E5DC">MY DS</text>
 <text x="230" y="380" text-anchor="middle" font-family="Montserrat" font-style="italic" font-weight="600" font-size="38" letter-spacing="2" fill="#F2EEE6">DS4</text>

    stop: function () { tw = null; }
  };
  function b64ToBuf(s) { var bin = atob(s), n = bin.length, u = new Uint8Array(n); for (var i = 0; i < n; i++) u[i] = bin.charCodeAt(i); return u.buffer; }
  var COLORS = [0xf2f1ee, 0x95836a, 0x0c0c0e, 0x5a5e63, 0x8c1018, 0x1f3460];
  new THREE.GLTFLoader().parse(b64ToBuf(window.DS4_GLB), '', function (gltf) {
    var model = gltf.scene, col = COLORS[parseInt(store('myds.color') || '0', 10) || 0] || COLORS[0];
    model.traverse(function (o) {
      if (!o.isMesh) return;
      o.castShadow = true; o.receiveShadow = true;
      var ms = Array.isArray(o.material) ? o.material : [o.material];
      ms.forEach(function (m, k) {
        if (m.name === 'body') {
          var pm = new THREE.MeshPhysicalMaterial({ color: col, metalness: 0.25, roughness: 0.28, clearcoat: 1, clearcoatRoughness: 0.04, side: THREE.DoubleSide });
          pm.name = 'body';
          if (Array.isArray(o.material)) o.material[k] = pm; else o.material = pm;
        }
        if (m.transparent) { m.depthWrite = false; o.castShadow = false; o.renderOrder = 2; }
      });
    });
    scene.add(model);
    shown = true; $('load').style.display = 'none';
    if (doIntro) fly(REST[0], REST[1], 2800, true);
  }, function () { fallback('load'); });

  var stopped = false, slowSince = 0, lastT = 0, sleeping = false;
  window.__stop3d = function () { stopped = true; };
  // MYDS behind another app (Android Auto, Spotify…): stop drawing, free the GPU; resume on return.
  window.__sleep = function (on) {
    if (on === sleeping) return;
    sleeping = on;
    if (!on && !stopped) { lastT = 0; slowSince = 0; requestAnimationFrame(loop); }
  };
  window.__pose = function (a, e) { tw = null; az = a; el = e; place(); renderer.render(scene, camera); };
  place();
  function loop(now) {
    if (stopped || sleeping) return;
    if (shown && lastT) {
      var fps = 1000 / Math.max(1, now - lastT);
      if (fps < 8) { if (!slowSince) slowSince = now; else if (now - slowSince > 4000) { fallback('fps'); return; } } else slowSince = 0;
    }
    lastT = now;
    if (tw && shown) {
      var t = Math.min(1, (now - tw.t0) / tw.ms), k = ease(t);
      az = tw.az + tw.dAz * k; el = tw.el + tw.dEl * k;
      if (t >= 1) tw = null;
    } else if (tw && !shown) tw.t0 = now;
    place();
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  loop(performance.now());
}
</script>
