<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta id="stockcss">
<title>Radyo</title>
<link rel="stylesheet" href="common.css">
<style>
/* One radio, three looks: it takes the skin of the home theme (Stock, DS4+, Panel). */
:root{--a:#5CC8B0;--on:#0B0E13;--bg:#0B0E13;--fg:#F3F5F7;--card:#161B23;--chip:#1E252F;--muted:#A3ADBA;--line:#232A35;--hot:#FF6B6B;--r:3.33vh;--rb:2.22vh}
body{background:var(--bg);color:var(--fg);font-family:'Inter',sans-serif;transition:background .3s,color .3s}
.num{font-family:'Space Grotesk',sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
.r{width:100vw;height:100vh;padding:2.78vh;display:flex;gap:2.22vh}
.card{border-radius:var(--r);background:var(--card)}
.chip{border:none;border-radius:var(--rb);background:var(--chip);color:var(--fg);height:6.67vh;padding:0 2.22vh;font-size:2.08vh;font-weight:600;display:inline-flex;align-items:center;gap:1vh;white-space:nowrap}
.chip.hot{background:var(--a);color:var(--on)}
.ctl{border:none;background:var(--chip);color:var(--fg);width:11.5vh;height:11.5vh;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:4.4vh;font-weight:700}
.ctl svg{width:4.6vh;height:4.6vh}
.ctl.sm{width:9vh;height:9vh}
.ctl.save{width:13.5vh;height:13.5vh;background:var(--a);color:var(--on)}
.ctl.save.saved{background:var(--hot);color:#fff}
.fav{border:none;border-radius:var(--rb);background:var(--chip);color:var(--fg);height:9.6vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3vh}
.fav b{font-family:'Space Grotesk',sans-serif;font-size:3.4vh}
.fav span{font-size:1.5vh;color:var(--muted)}
.fav.on{background:var(--a);color:var(--on)}.fav.on span{color:var(--on);opacity:.7}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;grid-auto-rows:9.6vh;gap:1.2vh;align-content:start}
.ttl{font-size:2.5vh;font-weight:700}
.sub{font-size:1.6vh;color:var(--muted)}
#lin{position:relative;height:10vh;overflow:hidden;border-radius:var(--rb);background:rgba(0,0,0,.25);touch-action:none}
#lin .needle{position:absolute;left:50%;top:0;bottom:0;width:.42vh;margin-left:-.21vh;background:var(--hot);border-radius:.2vh}
#arcBox{display:none;position:relative;flex:1;min-height:0;touch-action:none}
#arcBox svg{position:absolute;inset:0;width:100%;height:100%}
#src{display:none}
#srcBar{display:flex;align-items:center;gap:1.4vh;padding:1.2vh 1.6vh;border-radius:var(--rb);background:rgba(255,107,107,.12);color:#FFB0A0;font-size:1.9vh}
#srcBar.hide{display:none}

/* ---- DS4+ day ---- */
body.day{--bg:#EEF1F4;--fg:#11161D;--card:#FFFFFF;--chip:#EEF1F4;--muted:#56606C;--a:#1F8F78;--on:#fff}

/* ---- Panel 80: vacuum-fluorescent tuner ---- */
body.t-panel{--a:#56F2FF;--on:#031014;--bg:#030608;--fg:#56F2FF;--card:#0b1114;--chip:#0f181c;--muted:#2a8f98;--line:rgba(86,242,255,.22);--hot:#FF4FD8;--r:1.4vh;--rb:1.2vh;font-family:'Share Tech Mono',monospace}
body.t-panel.day{--bg:#d9dde0;--card:#eef1f3;--chip:#e3e8ea;--fg:#007f8c;--muted:#5f9aa0;--a:#007f8c;--on:#fff;--line:rgba(0,90,100,.28)}
body.t-panel .card{box-shadow:inset 0 0 0 1px var(--line),inset 0 0 4vh rgba(0,0,0,.5)}
body.t-panel .num,body.t-panel .fav b{font-family:'Share Tech Mono',monospace;font-weight:400;text-shadow:0 0 1vh currentColor}
body.t-panel .chip,body.t-panel .fav,body.t-panel .ctl{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--fg)}
body.t-panel .fav.on{background:rgba(86,242,255,.12);color:var(--fg);box-shadow:inset 0 0 0 1px var(--a),0 0 1.6vh rgba(86,242,255,.3)}
body.t-panel .ctl.save{background:transparent;color:var(--hot);box-shadow:inset 0 0 0 1px var(--hot)}
body.t-panel .ctl.save.saved{background:rgba(255,79,216,.18);color:var(--hot)}
body.t-panel #lin{background:#020405;box-shadow:inset 0 0 0 1px var(--line)}
body.t-panel #lin .needle{background:var(--hot);box-shadow:0 0 1vh var(--hot)}
/* ---- Stock ---- */
body.t-stock{--a:#E8D5B0;--on:#111;--bg:#050506;--card:transparent;--chip:#1a1b1f;--muted:#A8A39A;--fg:#EEEAE2;--hot:#D3242E;--r:44px;--rb:14px;font-family:'Montserrat',sans-serif;
  background:radial-gradient(70% 60% at 50% 42%,#1b1c1f 0%,#0b0b0d 55%,#040405 100%)}
body.t-stock .num{font-family:'Montserrat',sans-serif;font-style:italic;font-weight:600}
body.t-stock .card{background:linear-gradient(180deg,rgba(28,29,32,.92),rgba(10,10,12,.92));box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),inset 0 1px 0 rgba(255,255,255,.18),0 18px 40px rgba(0,0,0,.6)}
body.t-stock .ttl{font-style:italic;font-weight:600}
body.t-stock .chip{background:linear-gradient(180deg,rgba(36,37,41,.95),rgba(12,12,14,.95));box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);font-style:italic}
body.t-stock .chip.hot{background:linear-gradient(180deg,#f3e6cc,#cdb58b);color:#111}
body.t-stock .fav{transform:skewX(-10deg);background:linear-gradient(180deg,rgba(36,37,41,.95),rgba(12,12,14,.95));box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),inset 0 1px 0 rgba(255,255,255,.2)}
body.t-stock .fav>*{transform:skewX(10deg)}
body.t-stock .fav b{font-family:'Montserrat',sans-serif;font-style:italic;font-weight:600}
body.t-stock .fav.on{background:linear-gradient(180deg,rgba(60,56,48,.95),rgba(16,16,18,.95));color:var(--fg);box-shadow:inset 0 0 0 1px rgba(240,222,186,.6),inset 0 2px 0 rgba(255,236,200,.85),0 -2px 18px rgba(240,215,170,.25)}
body.t-stock .fav.on span{color:var(--a);opacity:1}
body.t-stock .ctl{background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
body.t-stock .ctl.save{background:transparent;color:var(--a);box-shadow:0 0 0 2px #E2CFA8,0 0 14px rgba(226,207,168,.35),inset 0 0 12px rgba(226,207,168,.15)}
body.t-stock .ctl.save.saved{background:rgba(211,36,46,.18);color:#ff8b7e;box-shadow:0 0 0 2px #D3242E,0 0 16px rgba(211,36,46,.45)}
body.t-stock #lin{display:none}
body.t-stock #arcBox{display:block}
body.t-stock #bigFreq{display:none !important}
body.t-stock #srcBar{background:rgba(211,36,46,.14)}
</style>
</head>
<body>
<div class="r">
  <section class="card" style="flex:1;min-width:0;padding:2.78vh;display:flex;flex-direction:column;gap:2vh">
    <div style="display:flex;align-items:center;gap:1.6vh">
      <button class="key chip" id="back">‹ Geri</button>
      <span class="ttl" style="font-size:3.2vh">Radyo</span>
      <div style="flex:1"></div>
      <span id="stereo" class="sub" style="font-weight:700;color:var(--a);display:none;letter-spacing:.2vh">STEREO</span>
      <span id="band" class="sub">FM</span>
    </div>
    <div id="srcBar" class="hide"><span style="flex:1" id="srcT">Hoparlörlerde başka bir kaynak çalıyor.</span><button class="key chip hot" id="takeOver" style="height:5.6vh">Radyoyu aç</button></div>
    <div id="bigFreq" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh">
      <div style="display:flex;align-items:baseline;gap:1.6vh"><span class="num" id="freq" style="font-size:19vh;line-height:1;letter-spacing:-.5vh">--.-</span><span class="num" id="unit" style="font-size:4.2vh;color:var(--muted)">MHz</span></div>
      <span id="hint" class="sub" style="font-size:2vh"></span>
    </div>
    <div id="arcBox"><svg id="arc" viewBox="0 0 600 420"></svg></div>
    <div id="lin"><svg id="scale" width="100%" height="100%" preserveAspectRatio="none"></svg><div class="needle"></div></div>
    <div style="display:flex;align-items:center;justify-content:center;gap:2.6vh">
      <button class="key ctl" id="seekDn" aria-label="Önceki istasyon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5v14"/><path d="M19 5 9 12l10 7z"/></svg></button>
      <button class="key ctl sm" id="stepDn" aria-label="0,1 aşağı">−</button>
      <button class="key ctl save" id="save" aria-label="Kaydet"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.7-9.3C.8 8.4 2.9 4.5 6.7 4.5c2 0 3.6 1.1 4.3 2.6.7-1.5 2.3-2.6 4.3-2.6 3.8 0 5.9 3.9 4.4 7.2C19.5 16.4 12 21 12 21z"/></svg></button>
      <button class="key ctl sm" id="stepUp" aria-label="0,1 yukarı">+</button>
      <button class="key ctl" id="seekUp" aria-label="Sonraki istasyon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 5v14"/><path d="M5 5l10 7-10 7z"/></svg></button>
    </div>
  </section>
  <section class="card" style="width:min(66vh,40vw);flex-shrink:0;padding:2.78vh;display:flex;flex-direction:column;gap:1.4vh;min-height:0">
    <div style="display:flex;align-items:baseline"><span class="ttl" style="flex:1">Kayıtlı istasyonlar</span><span class="sub">silmek için basılı tut</span></div>
    <div id="favs" class="grid" style="flex:1;min-height:0;overflow-y:auto"></div>
    <div id="presetBox" style="display:none"><div class="sub" style="margin:.6vh 0 1vh;letter-spacing:.2vh">RADYONUN HAFIZASI</div><div id="presets" class="grid" style="grid-auto-rows:7.6vh"></div></div>
  </section>
</div>
<script src="common.js"></script>
<script>
var has = typeof Car !== 'undefined';
function R(name) { var a = [].slice.call(arguments, 1); try { return has && Car[name] ? Car[name].apply(Car, a) : null; } catch (e) { return null; } }
var TH = +(R('theme') || 7);
document.body.classList.add(TH === 8 ? 't-stock' : TH === 4 ? 't-panel' : 't-ds4');
car.on(function (s) { if (TH !== 8) document.body.classList.toggle('day', s.night === false); });

var favs = [];
try { favs = JSON.parse(store('radio.favs') || '[]') || []; } catch (e) { favs = []; }
var cur = 0, presets = [], curPs = '';
function mhz(k) { return k > 30000 ? (k / 1000).toFixed(1).replace('.', ',') : String(k); }
function unit(k) { return k > 30000 ? 'MHz' : 'kHz'; }
function grid(box, list, cls, onHold) {
  box.innerHTML = '';
  list.forEach(function (k, i) {
    var b = document.createElement('button'); b.className = 'key fav' + (k === cur ? ' on' : '');
    b.innerHTML = '<b>' + mhz(k) + '</b><span>' + (k > 30000 ? 'FM' : 'AM') + ' · ' + (i + 1) + '</span>';
    var t = null, held = false;
    if (onHold) {
      b.addEventListener('pointerdown', function () { held = false; t = setTimeout(function () { held = true; onHold(i); }, 800); });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { b.addEventListener(ev, function () { clearTimeout(t); }); });
    }
    b.onclick = function () { if (held) return; R('radioTune', k); cur = k; paint(); };
    box.appendChild(b);
  });
}
function paintFavs() {
  grid($('favs'), favs, 'fav', function (i) { favs.splice(i, 1); save(); paint(); });
  if (!favs.length) $('favs').innerHTML = '<div class="sub" style="grid-column:1/4;font-size:2vh;line-height:1.5;padding:1vh">Beğendiğin istasyonda ♥ tuşuna bas, burada dursun. Dokununca o istasyona geçer.</div>';
  $('presetBox').style.display = presets.length ? 'block' : 'none';
  grid($('presets'), presets, 'fav', null);
}
function save() { store('radio.favs', JSON.stringify(favs)); }

// ---- linear scale (DS4+, Panel) ----
function drawScale() {
  var svg = $('scale'), w = svg.clientWidth || 800, h = svg.clientHeight || 60, px = w / 6, center = (cur || 98000) / 1000, g = '';
  var col = getComputedStyle(document.body).getPropertyValue('--muted').trim() || '#A3ADBA';
  for (var f = Math.floor((center - 4) * 10) / 10; f <= center + 4; f = Math.round((f + 0.1) * 10) / 10) {
    var x = w / 2 + (f - center) * px, major = Math.abs(f - Math.round(f)) < 0.01;
    g += '<line x1="' + x + '" y1="' + (major ? h * .25 : h * .55) + '" x2="' + x + '" y2="' + h + '" stroke="' + col + '" stroke-opacity="' + (major ? .9 : .4) + '" stroke-width="' + (major ? 2 : 1) + '"/>';
    if (major) g += '<text x="' + x + '" y="' + (h * .2) + '" fill="' + col + '" font-size="' + (h * .2) + '" text-anchor="middle" font-family="Inter">' + Math.round(f) + '</text>';
  }
  svg.innerHTML = g;
}
(function () {
  var d = $('lin'), sx = 0, base = 0, on = false;
  d.addEventListener('pointerdown', function (e) { on = true; sx = e.clientX; base = cur || 98000; try { d.setPointerCapture(e.pointerId); } catch (x) {} });
  d.addEventListener('pointermove', function (e) {
    if (!on) return; var w = d.clientWidth / 6, k = Math.round((base / 1000 - (e.clientX - sx) / w) * 10) * 100;
    k = Math.max(87500, Math.min(108000, k)); if (k !== cur) { cur = k; $('freq').textContent = mhz(cur); drawScale(); }
  });
  function up() { if (!on) return; on = false; R('radioTune', cur); paint(); }
  d.addEventListener('pointerup', up); d.addEventListener('pointercancel', up);
})();

// ---- Stock: round tuner dial, like the Stock speed dial ----
var A0 = -135, SW = 270, F0 = 87.5, F1 = 108, CX = 300, CY = 236, RR = 182;
function angF(f) { return A0 + (Math.max(F0, Math.min(F1, f)) - F0) / (F1 - F0) * SW; }
function pt(a, r) { var t = a * Math.PI / 180; return [CX + r * Math.sin(t), CY - r * Math.cos(t)]; }
function drawArc() {
  var f = (cur || 98000) / 1000, g = '<defs><linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f1e7"/><stop offset=".35" stop-color="#5b5852"/><stop offset=".6" stop-color="#2a2928"/><stop offset="1" stop-color="#d9d2c4"/></linearGradient>' +
    '<radialGradient id="face" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#2a2b2f"/><stop offset=".65" stop-color="#121215"/><stop offset="1" stop-color="#050506"/></radialGradient></defs>';
  g += '<circle cx="' + CX + '" cy="' + CY + '" r="' + (RR + 26) + '" fill="#08080a"/><circle cx="' + CX + '" cy="' + CY + '" r="' + (RR + 24) + '" fill="none" stroke="url(#rim)" stroke-width="3"/>';
  for (var v = 875; v <= 1080; v += 5) {
    var a = angF(v / 10), big = v % 20 === 0, mid = v % 10 === 0, p1 = pt(a, RR + 14), p2 = pt(a, big ? RR - 4 : mid ? RR + 2 : RR + 7);
    g += '<line x1="' + p1[0].toFixed(1) + '" y1="' + p1[1].toFixed(1) + '" x2="' + p2[0].toFixed(1) + '" y2="' + p2[1].toFixed(1) + '" stroke="' + (big ? '#F0EBE2' : '#9e998f') + '" stroke-width="' + (big ? 2.2 : 1.1) + '"/>';
    if (big) { var q = pt(a, RR - 22); g += '<text x="' + q[0].toFixed(1) + '" y="' + q[1].toFixed(1) + '" transform="rotate(' + a.toFixed(1) + ' ' + q[0].toFixed(1) + ' ' + q[1].toFixed(1) + ')" text-anchor="middle" dominant-baseline="central" font-family="Montserrat" font-style="italic" font-weight="500" font-size="20" fill="#F0EBE2">' + (v / 10) + '</text>'; }
  }
  var s = pt(A0, RR + 22), e = pt(angF(f), RR + 22), big2 = angF(f) - A0 > 180 ? 1 : 0;
  if (cur) g += '<path d="M' + s[0] + ' ' + s[1] + ' A' + (RR + 22) + ' ' + (RR + 22) + ' 0 ' + big2 + ' 1 ' + e[0] + ' ' + e[1] + '" fill="none" stroke="#E8D5B0" stroke-width="3" stroke-linecap="round" opacity=".6"/>';
  g += '<circle cx="' + CX + '" cy="' + CY + '" r="' + (RR - 42) + '" fill="url(#face)" stroke="url(#rim)" stroke-width="3"/>';
  var n1 = pt(angF(f), RR - 2), n2 = pt(angF(f), RR + 24);
  g += '<line x1="' + n1[0] + '" y1="' + n1[1] + '" x2="' + n2[0] + '" y2="' + n2[1] + '" stroke="#ff4a3f" stroke-width="5" stroke-linecap="round"/>';
  g += '<text x="' + CX + '" y="' + (CY - 62) + '" text-anchor="middle" font-family="Montserrat" font-style="italic" font-size="20" letter-spacing="5" fill="#E9E5DC">' + (curPs ? curPs.replace(/[<&]/g, '') : 'RADYO') + '</text>';
  g += '<text x="' + CX + '" y="' + (CY + 24) + '" text-anchor="middle" font-family="Montserrat" font-style="italic" font-weight="600" font-size="80" fill="#F2EEE6">' + (cur ? mhz(cur) : '--,-') + '</text>';
  g += '<text x="' + CX + '" y="' + (CY + 62) + '" text-anchor="middle" font-family="Montserrat" font-style="italic" font-size="22" fill="#A8A39A">' + unit(cur || 98000) + ($('band').textContent ? ' · ' + $('band').textContent : '') + '</text>';
  $('arc').innerHTML = g;
}
(function () {
  var d = $('arcBox'), on = false;
  function at(e) {
    var r = d.getBoundingClientRect(), k = Math.min(r.width / 600, r.height / 420), ox = r.left + (r.width - 600 * k) / 2, oy = r.top + (r.height - 420 * k) / 2;
    var x = (e.clientX - ox) / k - CX, y = (e.clientY - oy) / k - CY, a = Math.atan2(x, -y) * 180 / Math.PI;
    if (a < A0 || a > A0 + SW) return null;
    return Math.round((F0 + (a - A0) / SW * (F1 - F0)) * 10) * 100;
  }
  d.addEventListener('pointerdown', function (e) { var k = at(e); if (k === null) return; on = true; try { d.setPointerCapture(e.pointerId); } catch (x) {} cur = k; paint(); });
  d.addEventListener('pointermove', function (e) { if (!on) return; var k = at(e); if (k !== null && k !== cur) { cur = k; paint(); } });
  function up() { if (!on) return; on = false; R('radioTune', cur); }
  d.addEventListener('pointerup', up); d.addEventListener('pointercancel', up);
})();

function paint() {
  $('freq').textContent = cur ? mhz(cur) : '--,-'; $('unit').textContent = unit(cur || 98000);
  $('save').classList.toggle('saved', favs.indexOf(cur) >= 0);
  paintFavs();
  if (TH === 8) drawArc(); else drawScale();
}
var srcOk = true;
function poll() {
  var info = {}; try { info = JSON.parse(R('radioInfo') || '{}'); } catch (e) {}
  var ps = info.ps || '', rt = info.rt || '';
  $('hint').textContent = info.ok ? (ps + (rt ? ' · ' + rt : '')) : 'Bu ünitede tuner bulunamadı.';
  if (ps !== curPs) { curPs = ps; if (TH === 8) drawArc(); }
  if (info.khz && info.khz !== cur) { cur = info.khz; paint(); }
  $('stereo').style.display = info.stereo ? 'inline' : 'none';
  var b = info.band || 'FM'; if ($('band').textContent !== b) { $('band').textContent = b; if (TH === 8) drawArc(); }
  var p = (info.presets || []).filter(function (k) { return k > 0; });
  if (p.join() !== presets.join()) { presets = p; paintFavs(); }
  // the tuner is not on the speakers: offer to switch (MYDS asks the system, the factory app stays closed)
  var other = info.ok && info.source && !info.active;
  $('srcBar').classList.toggle('hide', !other);
  if (other) $('srcT').textContent = 'Hoparlörlerde şu an başka kaynak çalıyor.';
  setTimeout(poll, 500);
}
$('takeOver').onclick = function () { R('radioPlay'); };
$('seekUp').onclick = function () { R('radioSeek', true); };
$('seekDn').onclick = function () { R('radioSeek', false); };
$('stepUp').onclick = function () { R('radioStep', true); };
$('stepDn').onclick = function () { R('radioStep', false); };
$('save').onclick = function () {
  if (!cur) return;
  var i = favs.indexOf(cur);
  if (i >= 0) favs.splice(i, 1); else { favs.push(cur); favs.sort(function (a, b) { return a - b; }); }
  save(); paint();
};
$('back').onclick = function () { call('open', 'themehome'); };
addEventListener('resize', paint);
R('radioPlay');
paint(); poll();
</script>
</body>
</html>
