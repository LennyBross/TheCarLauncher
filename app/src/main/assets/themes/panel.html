<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Panel 80</title>
<link rel="stylesheet" href="common.css">
<style>
/* PANEL 80 — an 80s digital dashboard: vacuum-fluorescent read-outs, segment bar graphs,
   tell-tale pictograms instead of words. Cyan read-outs, amber warnings, magenta for the
   engine sound. Day mode = the same dash with the display "lights" on a pale bezel. */
:root{--vfd:var(--pv,#56F2FF);--vfd2:var(--pv2,#2a8f98);--amb:#FFB347;--mag:#FF4FD8;--grn:#7CFF6B;--off:rgba(var(--pvr,86,242,255),.09);--bg:#030608;--bez:#0b1114;--edge:rgba(var(--pvr,86,242,255),.22)}
body.day{--bg:#d9dde0;--bez:#eef1f3;--vfd:#007f8c;--vfd2:#5f9aa0;--off:rgba(0,90,100,.10);--edge:rgba(0,90,100,.28);--amb:#b0641a;--mag:#b0208f;--grn:#2c8a20}
body{background:var(--bg);color:var(--vfd);font-family:'Share Tech Mono',monospace;overflow:hidden;user-select:none}
.glow{text-shadow:0 0 .9vh currentColor}
body.day .glow{text-shadow:none}
.d{position:fixed;inset:2.2vh;display:grid;grid-template-columns:30% 1fr 30%;grid-template-rows:9vh 1fr 14vh;gap:2vh}
.box{background:var(--bez);border-radius:1.4vh;box-shadow:inset 0 0 0 1px var(--edge),inset 0 0 4vh rgba(0,0,0,.6);position:relative;overflow:hidden}
body.day .box{box-shadow:inset 0 0 0 1px var(--edge),0 .6vh 1.6vh rgba(0,0,0,.12)}
.box::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);opacity:.5}
body.day .box::after{opacity:.12}
svg.ic{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* top strip */
#top{grid-column:1/4;display:flex;align-items:center;padding:0 2.4vh;gap:3vh}
#top .t{font-size:5.4vh;letter-spacing:.3vh}
#top .s{font-size:2.6vh;color:var(--vfd2);letter-spacing:.3vh;display:flex;align-items:center;gap:.8vh}
#top .s svg{width:2.8vh;height:2.8vh}
/* left: fuel + trip */
#left{display:flex;flex-direction:column;gap:1.6vh;padding:2.2vh}
.lbl{display:flex;align-items:center;gap:1.2vh;color:var(--vfd2)}
.lbl svg{width:3.4vh;height:3.4vh}
.num{font-size:6.4vh;line-height:1;letter-spacing:.2vh}
.num small{font-size:2.2vh;color:var(--vfd2);margin-left:.6vh}
.bars{display:flex;gap:.45vh;height:3.6vh;align-items:stretch}
.bars i{flex:1;border-radius:.3vh;background:var(--off)}
.bars i.on{background:var(--vfd);box-shadow:0 0 .8vh var(--vfd)}
.bars i.on.lo{background:var(--amb);box-shadow:0 0 .8vh var(--amb)}
body.day .bars i.on{box-shadow:none}
/* centre: segment tach + big speed */
#mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh}
#tach{width:92%;height:34%}
#spd{font-size:24vh;line-height:.85;letter-spacing:.6vh;position:relative}
#spdGhost{position:absolute;left:0;top:0;color:var(--off);text-shadow:none}
#spdU{font-size:3vh;color:var(--vfd2);letter-spacing:.6vh}
#rpmT{font-size:2.6vh;color:var(--mag);letter-spacing:.3vh;min-height:3vh}
/* right: media / radio */
#right{display:flex;flex-direction:column;gap:1.4vh;padding:2.2vh}
#mt{font-size:4vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ma{font-size:2.6vh;color:var(--vfd2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#eq{flex:1;display:flex;gap:.6vh;align-items:flex-end;min-height:6vh}
#eq i{flex:1;background:var(--vfd);opacity:.85;border-radius:.2vh;transition:height .15s}
.mk{display:flex;gap:1.2vh}
.mk button,.keys button{border:none;background:transparent;color:var(--vfd);border-radius:1.2vh;box-shadow:inset 0 0 0 1px var(--edge);display:flex;align-items:center;justify-content:center}
.mk button{flex:1;height:8vh}
.mk button svg{width:3.6vh;height:3.6vh}
.mk button:active,.keys button:active{background:var(--off)}
/* bottom keys: pictograms only */
#keys{grid-column:1/4;display:flex;gap:1.4vh;padding:1.4vh}
.keys button{flex:1}
.keys button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6vh}
.keys button svg{width:4.2vh;height:4.2vh}
.keys button em{font-style:normal;font-size:1.5vh;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.keys button.mag{color:var(--mag);box-shadow:inset 0 0 0 1px rgba(255,79,216,.35)}
.keys button.mag.on{background:rgba(255,79,216,.14);box-shadow:inset 0 0 0 1px var(--mag),0 0 2vh rgba(255,79,216,.35)}
#lookM{position:fixed;right:3vh;top:11vh;z-index:30;display:none;flex-direction:column;gap:2vh;padding:2.4vh;width:52vh;background:var(--bg);border-radius:1.4vh;box-shadow:inset 0 0 0 1px var(--vfd),0 0 4vh rgba(0,0,0,.8)}
#lookM.on{display:flex}
#lookM .lr{display:flex;align-items:center;gap:1.6vh}
#lookM .lr svg{width:3.6vh;height:3.6vh;flex-shrink:0}
#lookM input{flex:1;accent-color:var(--vfd);height:5vh}
#lookM b{width:7vh;text-align:right;font-weight:400;font-size:2.6vh;text-shadow:0 0 1vh currentColor}
#lookM .seg{display:flex;gap:1vh}
#lookM .seg button{flex:1;height:7vh;border-radius:1vh;border:none;background:transparent;color:var(--vfd);box-shadow:inset 0 0 0 1px var(--edge);display:flex;align-items:center;justify-content:center}
#lookM .seg button.on{background:var(--vfd);color:var(--bg)}
#lookM .sw{width:6vh;height:6vh;border-radius:50%;border:none;flex:none;box-shadow:inset 0 0 0 2px rgba(0,0,0,.5)}
#lookM .sw.on{box-shadow:0 0 0 .5vh var(--bg),0 0 0 .9vh currentColor,0 0 2vh currentColor}
/* ---- v2 (owner's notes): one font everywhere, a real 80s dash — seven-segment read-outs, chrome bezel */
button,input,select,em,b,small{font-family:'Share Tech Mono',monospace !important}
*{font-family:'Share Tech Mono',monospace}
.box{background:linear-gradient(180deg,rgba(255,255,255,.035),transparent 30%),var(--bez);box-shadow:inset 0 0 0 1px var(--edge),inset 0 .25vh 0 rgba(255,255,255,.08),inset 0 0 4vh rgba(0,0,0,.6),0 0 0 .35vh #15191c,0 0 0 .5vh rgba(255,255,255,.06)}
.lbl,.s,#spdU,#srcT,#ma,.keys button em{text-transform:uppercase;letter-spacing:.35vh}
svg.seg7 .on{fill:var(--vfd);filter:drop-shadow(0 0 .7vh var(--vfd))}
svg.seg7 .of{fill:var(--off)}
body.day svg.seg7 .on{filter:none}
#spd{font-size:0;line-height:0}
#spd svg{height:23vh;width:auto;display:block}
#clockS svg{height:5vh;width:auto;display:block}
.keys{gap:1.4vh}
.keys button svg{width:4.8vh;height:4.8vh}
.keys button em{font-size:2vh;opacity:1;font-style:normal}
</style>
</head>
<body>
<div class="d">
  <div class="box" id="top">
    <span class="t" id="clockS"></span><span id="clock" style="display:none">--:--</span>
    <span class="s" id="date"></span>
    <span style="flex:1"></span>
    <span class="s glow"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v11"/><circle cx="12" cy="17" r="3.5"/><path d="M15 6h3M15 9h2"/></svg><b id="tmp">--</b>°C</span>
    <span class="s glow" style="color:var(--grn)"><svg class="ic" viewBox="0 0 24 24"><path d="M5 19c8 0 14-6 14-14C11 5 5 11 5 19z"/><path d="M5 19l7-7"/></svg><b id="eco">--</b></span>
    <button class="key" id="nightBtn" style="border:none;background:none;color:var(--vfd2)" aria-label="Işık ve renk"><svg class="ic" style="width:3.6vh;height:3.6vh" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </div>

  <div class="box" id="left">
    <div class="lbl"><svg class="ic" viewBox="0 0 24 24"><path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16"/><path d="M3 21h12"/><path d="M6.5 7h5v4h-5z"/><path d="M14 9h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V8l-3-3"/></svg><span style="color:var(--vfd2)">E</span><span style="flex:1"></span><span>F</span></div>
    <div class="bars" id="fuelB"></div>
    <div class="num glow" id="rng">---<small>km</small></div>
    <div class="lbl" style="margin-top:1vh"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><path d="M4 20 20 4"/></svg></div>
    <div class="num glow" id="cons">--.-<small>L/100</small></div>
    <div class="lbl" style="margin-top:1vh"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20 9 4M20 20 15 4M12 6v2M12 11v2M12 16v3"/></svg></div>
    <div class="num glow" id="trip">---.-<small>km</small></div>
  </div>

  <div class="box" id="mid">
    <svg id="tach" viewBox="0 0 400 120" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="spd"></div><span id="spdV" style="display:none"></span>
    <div id="spdU">KM/H</div>
    <div id="rpmT"></div>
  </div>

  <div class="box" id="right">
    <div class="lbl"><svg class="ic" id="srcI" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg><span id="srcT"></span></div>
    <div id="mt" class="glow">---</div>
    <div id="ma"></div>
    <div id="eq"></div>
    <div class="mk">
      <button class="key" id="prev" aria-label="Önceki"><svg class="ic" viewBox="0 0 24 24"><path d="M6 5v14"/><path d="M19 5 9 12l10 7z"/></svg></button>
      <button class="key" id="play" aria-label="Çal / duraklat"><svg class="ic" id="playI" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="key" id="next" aria-label="Sonraki"><svg class="ic" viewBox="0 0 24 24"><path d="M18 5v14"/><path d="M5 5l10 7-10 7z"/></svg></button>
    </div>
  </div>

  <div class="box keys" id="keys"></div>
</div>
<div id="lookM">
  <div class="seg"><button class="key" id="lkNight" aria-label="Gece"><svg class="ic" style="width:3.6vh;height:3.6vh" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button><button class="key" id="lkDay" aria-label="Gündüz"><svg class="ic" style="width:3.6vh;height:3.6vh" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div>
  <div class="lr"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/></svg><input type="range" min="0" max="100" step="5" id="lkBri" aria-label="Ekran ışığı"><b id="lkBriT"></b></div>
  <div class="lr" style="justify-content:space-between" id="lkCol"></div>
</div>
<div id="veil" style="position:fixed;inset:0;background:#000;pointer-events:none;opacity:0;z-index:25"></div>
<script src="common.js"></script>
<script>
// Tell-tale style pictograms for the key row (no words)
var K = [
  ['nav', MYDS_ICONS.nav, 'Harita'], ['srcPick', MYDS_ICONS.music, 'Müzik'], ['radio', MYDS_ICONS.radio, 'Radyo'], ['aa', MYDS_ICONS.aa, 'Android Auto'],
  ['engine', MYDS_ICONS.engine, 'Motor sesi', 'mag'], ['eq', MYDS_ICONS.eq, 'Hi-Fi'], ['settings', MYDS_ICONS.settings, 'Ayarlar']];
var hasMaps = false;
var SEG7 = { '0': 'abcdef', '1': 'bc', '2': 'abged', '3': 'abgcd', '4': 'fgbc', '5': 'afgcd', '6': 'afgedc', '7': 'abc', '8': 'abcdefg', '9': 'abcdfg', '-': 'g', ' ': '' };
function seg7(str, colon) {
  var W = 60, H = 100, t = 11, g = 2, x = 0, out = '';
  function poly(pts, on) { return '<polygon class="' + (on ? 'on' : 'of') + '" points="' + pts + '"/>'; }
  for (var i = 0; i < str.length; i++) {
    var ch = str[i];
    if (ch === ':') { out += '<rect class="on" x="' + (x + 4) + '" y="30" width="9" height="9"/><rect class="on" x="' + (x + 4) + '" y="62" width="9" height="9"/>'; x += 20; continue; }
    var L = SEG7[ch] || '', X = x, sk = 6;   // slight italic slant, like the old dashes
    function hs(y, on) { return poly((X + t / 2 + g + sk * (1 - y / H)) + ',' + y + ' ' + (X + W - t / 2 - g + sk * (1 - y / H)) + ',' + y + ' ' + (X + W - t - g + sk * (1 - (y + t / 2) / H)) + ',' + (y + t / 2) + ' ' + (X + t + g + sk * (1 - (y + t / 2) / H)) + ',' + (y + t / 2) + ' ' + (X + t + g + sk * (1 - (y - t / 2) / H)) + ',' + (y - t / 2) + ' ' + (X + W - t - g + sk * (1 - (y - t / 2) / H)) + ',' + (y - t / 2), on); }
    function vs(xx, y1, y2, on) { var a = X + xx; return poly((a + sk * (1 - (y1 + g) / H)) + ',' + (y1 + g) + ' ' + (a + t / 2 + sk * (1 - (y1 + t / 2 + g) / H)) + ',' + (y1 + t / 2 + g) + ' ' + (a + t / 2 + sk * (1 - (y2 - t / 2 - g) / H)) + ',' + (y2 - t / 2 - g) + ' ' + (a + sk * (1 - (y2 - g) / H)) + ',' + (y2 - g) + ' ' + (a - t / 2 + sk * (1 - (y2 - t / 2 - g) / H)) + ',' + (y2 - t / 2 - g) + ' ' + (a - t / 2 + sk * (1 - (y1 + t / 2 + g) / H)) + ',' + (y1 + t / 2 + g), on); }
    out += hs(t / 2, L.indexOf('a') >= 0) + hs(H / 2, L.indexOf('g') >= 0) + hs(H - t / 2, L.indexOf('d') >= 0);
    out += vs(t / 2, t / 2, H / 2, L.indexOf('f') >= 0) + vs(W - t / 2, t / 2, H / 2, L.indexOf('b') >= 0);
    out += vs(t / 2, H / 2, H - t / 2, L.indexOf('e') >= 0) + vs(W - t / 2, H / 2, H - t / 2, L.indexOf('c') >= 0);
    x += W + 14;
  }
  return '<svg class="seg7" viewBox="-2 -2 ' + (x + 4) + ' ' + (H + 4) + '">' + out + '</svg>';
}
K.forEach(function (k) {
  var b = document.createElement('button'); b.className = 'key' + (k[3] ? ' ' + k[3] : ''); b.id = 'k-' + k[0];
  b.setAttribute('aria-label', k[2]);
  b.innerHTML = '<svg class="ic" viewBox="0 0 24 24">' + k[1] + '</svg><em>' + k[2] + '</em>';
  b.onclick = function () {
    var w = k[0];
    if (w === 'nav') w = 'split';
    if (w === 'srcPick') w = 'music';
    if (w === 'engine') { if (cpOn !== null) { call('open', 'cpToggle'); return; } }
    call('open', w);
  };
  if (k[0] === 'engine') {
    var t = null;
    b.addEventListener('pointerdown', function () { t = setTimeout(function () { t = 'held'; call('open', 'engine'); }, 700); });
    b.addEventListener('pointerup', function () { if (t !== 'held') clearTimeout(t); });
  }
  $('keys').appendChild(b);
});
for (var i = 0; i < 20; i++) $('fuelB').appendChild(document.createElement('i'));
for (var j = 0; j < 14; j++) { var e = document.createElement('i'); e.style.height = '10%'; $('eq').appendChild(e); }

// 32-segment stepped tach (rpm with CataraPatara, else speed)
var SEG = 32;
(function () {
  var g = '';
  for (var i = 0; i < SEG; i++) {
    var x = 8 + i * 12, h = 30 + i * 2.4;
    g += '<rect id="sg' + i + '" x="' + x + '" y="' + (110 - h) + '" width="9" height="' + h + '" rx="1.5"/>';
  }
  $('tach').innerHTML = g;
})();
function tach(f, hot) {
  var n = Math.round(Math.max(0, Math.min(1, f)) * SEG);
  for (var i = 0; i < SEG; i++) {
    var on = i < n, red = i >= SEG * .82;
    var c = !on ? 'var(--off)' : red ? 'var(--amb)' : hot ? 'var(--mag)' : 'var(--vfd)';
    var r = $('sg' + i); r.setAttribute('fill', c);
    r.style.filter = on && !document.body.classList.contains('day') ? 'drop-shadow(0 0 3px ' + (red ? '#FFB347' : hot ? '#FF4FD8' : (getComputedStyle(document.documentElement).getPropertyValue('--pv').trim()||'var(--pv,#56F2FF)')) + ')' : '';
  }
}
var night = true, cpOn = null;
// Light & colour: night / day, screen light (below 10 the panel itself dims further), display colour.
function setNightP(on) { night = on; document.body.classList.toggle('day', !night); call('setNight', night); paintLook(); }
function setBri(v) {
  store('panel.bri', v);
  call('setBrightness', Math.max(10, v));
  $('veil').style.opacity = v < 10 ? ((10 - v) / 10 * .75).toFixed(2) : 0;
  $('lkBriT').textContent = v;
}
function paintLook() {
  $('lkNight').classList.toggle('on', night); $('lkDay').classList.toggle('on', !night);
  var cur = (store('panel.hue') || '#56F2FF').toUpperCase();
  [].forEach.call($('lkCol').children, function (b) { b.classList.toggle('on', b.getAttribute('data-c').toUpperCase() === cur); });
}
PANEL_COLORS.forEach(function (c) {
  var b = document.createElement('button'); b.className = 'key sw'; b.setAttribute('data-c', c[0]); b.setAttribute('aria-label', c[1]);
  b.style.background = c[0]; b.style.color = c[0];
  b.onclick = function () { panelLook(c[0]); call('panelColor', c[0]); paintLook(); };
  $('lkCol').appendChild(b);
});
$('lkNight').onclick = function () { setNightP(true); };
$('lkDay').onclick = function () { setNightP(false); };
$('lkBri').oninput = function () { setBri(+this.value); };
(function () { var v = +(store('panel.bri') || 80); $('lkBri').value = v; $('lkBriT').textContent = v; $('veil').style.opacity = v < 10 ? ((10 - v) / 10 * .75).toFixed(2) : 0; })();
$('nightBtn').onclick = function (e) { e.stopPropagation(); paintLook(); $('lookM').classList.toggle('on'); };
document.addEventListener('click', function (e) { if (!$('lookM').contains(e.target) && !$('nightBtn').contains(e.target)) $('lookM').classList.remove('on'); });
$('play').onclick = function () { call('media', 'play'); };
$('prev').onclick = function () { call('media', 'prev'); };
$('next').onclick = function () { call('media', 'next'); };
function pad(v, n) { v = String(v); while (v.length < n) v = ' ' + v; return v; }
car.on(function (s) {
  hasMaps = !!s.hasMaps;
  $('clock').textContent = s.time || '--:--';
  $('clockS').innerHTML = seg7((s.time || '--:--').replace(/^(\d):/, ' $1:'));
  $('date').textContent = (s.date || '').toLocaleUpperCase('tr-TR');
  night = s.night !== false; document.body.classList.toggle('day', !night);
  $('tmp').textContent = s.outdoor !== undefined ? Math.round(s.outdoor) : s.temp !== undefined ? s.temp : '--';
  $('eco').textContent = eco.feed(s);
  var ov = s.obd && s.obd.ok && s.obd.v ? s.obd.v.speed : null;   // the car's own speed first, then GPS
  var v = ov != null ? Math.round(ov) : s.gps === 'ok' ? Math.round(s.speed || 0) : null;
  $('spdV').textContent = v === null ? '---' : pad(v, 3);
  var sv = v === null ? '---' : String(Math.round(v)); while (sv.length < 3) sv = ' ' + sv;
  $('spd').innerHTML = seg7(sv);
  cpOn = s.cp ? !!s.cpOn : null;
  $('k-engine').classList.toggle('on', !!s.cpOn);
  if (s.rpm) { tach(s.rpm / 7000, true); $('rpmT').textContent = s.rpm + ' D/D' + (s.coolant !== undefined ? '  ·  ' + Math.round(s.coolant) + '°C' : ''); }
  else if (s.obd && !!(s.obd.target || s.obd.mode === 'ble')) { tach(0, false); $('rpmT').textContent = '— D/D'; }
  else if (s.cpOn && s.cpRpm) { tach(s.cpRpm / (s.cpRed || 6500), true); $('rpmT').textContent = s.cpRpm + ' D/D' + (s.cpGear ? '  ·  ' + s.cpGear : ''); }
  else { tach(v === null ? 0 : v / 200, false); $('rpmT').textContent = ''; }
  // fuel bar graph, range, consumption, trip
  var tank = s.tank || 60, left = s.fuelLeft, f = left !== undefined ? left / tank : s.range ? Math.min(1, s.range / 900) : 0, n = Math.round(f * 20);
  [].forEach.call($('fuelB').children, function (e, k) { e.className = k < n ? (n <= 3 ? 'on lo' : 'on') : ''; });
  $('rng').innerHTML = (s.range ? pad(Math.round(s.range), 3) : '---') + '<small>km</small>';
  var c = s.avgL100 > 0 ? s.avgL100 : s.inst !== undefined ? s.inst : s.l100;
  $('cons').innerHTML = (c !== undefined && c !== null ? Number(c).toFixed(1) : '--.-') + '<small>L/100</small>';
  $('trip').innerHTML = (s.tripKm !== undefined ? Number(s.tripKm).toFixed(1) : '---.-') + '<small>km</small>';
  // media or radio
  var tun = s.tuner && s.khz;
  $('srcT').textContent = (tun ? 'FM' : (s.srcLabel || '')).toLocaleUpperCase('tr-TR');
  $('mt').textContent = tun ? (s.khz / 1000).toFixed(1) + ' MHZ' : (s.title || '---').toLocaleUpperCase('tr-TR');
  $('ma').textContent = tun ? (s.rdsPs || '') : (s.artist || '').toLocaleUpperCase('tr-TR');
