<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Panel</title>
<link rel="stylesheet" href="common.css">
<style>
:root{--a:#C9A27A;--bg:#0C0E12;--card:#1A1D23;--inner:#262A31;--text:#F4F2EE;--sub:#A9ADB6;--line:#2C3038;--tool:rgba(12,14,18,.85)}
body.day{--bg:#E9ECF0;--card:#FFFFFF;--inner:#EEF0F3;--text:#15171B;--sub:#565B64;--line:#D3D7DD;--a:#8A6438;--tool:rgba(255,255,255,.9)}
body{background:var(--bg);color:var(--text);font-family:'Montserrat',sans-serif;transition:background .3s,color .3s}
.root{width:100vw;height:100vh;display:flex;gap:1.94vh;padding:1.94vh}
.rail{width:11.67vh;flex-shrink:0;border-radius:4.17vh;background:var(--card);padding:2.22vh 0;display:flex;flex-direction:column;align-items:center;gap:1.94vh}
.rb{width:8.33vh;height:8.33vh;border-radius:50%;border:none;background:var(--inner);color:var(--text);display:flex;align-items:center;justify-content:center}
.rb svg,.tb svg{width:3.89vh;height:3.89vh}
.center{flex:1;min-width:0;position:relative;border-radius:4.17vh;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.39vh}
.tools{position:absolute;left:2.22vh;top:2.22vh;display:flex;flex-direction:column;gap:1.67vh}
.tb{width:7.5vh;height:7.5vh;border-radius:50%;border:1px solid var(--line);background:var(--tool);color:var(--text);display:flex;align-items:center;justify-content:center}
.tb svg{width:3.33vh;height:3.33vh}
.clock{font-size:20vh;font-weight:600;line-height:1;letter-spacing:-.4vh}
.aside{width:50vh;flex-shrink:0;display:flex;flex-direction:column;gap:1.94vh}
.card{border-radius:3.61vh;background:var(--card);padding:2.5vh;display:flex;flex-direction:column;gap:1.94vh}
.pill{flex:1;height:7.78vh;border-radius:3.89vh;border:none;font-size:2.22vh;font-weight:700;display:flex;align-items:center;justify-content:center;gap:1.11vh}
.pill svg{width:2.78vh;height:2.78vh}
.mk{height:8.06vh;border-radius:2.5vh;border:none;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div class="root">
<nav class="rail" aria-label="Uygulamalar">
<div style="display:flex;flex-direction:column;align-items:center;gap:.28vh;margin-bottom:.83vh"><span style="font-size:3.06vh;font-weight:700" id="clockS">--:--</span><span style="font-size:1.67vh;font-weight:600;color:var(--sub)">DS 4</span></div>
<button class="key rb" data-go="nav" aria-label="Navigasyon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg></button>
<button class="key rb" data-go="spotify" aria-label="Müzik"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></button>
<button class="key rb" data-go="phone" aria-label="Telefon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></button>
<button class="key rb" data-go="aa" aria-label="Android Auto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M10 18h4"/><path d="M9.5 9.5l2.5-2.5 2.5 2.5M12 7v6"/></svg></button>
<div style="flex:1"></div>
<button class="key rb" data-go="apps" aria-label="Tüm uygulamalar" style="background:var(--a);color:#14110D"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
</nav>
<main class="center">
<div class="tools">
<button class="key tb" data-go="settings" aria-label="Ayarlar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></button>
<button class="key tb" data-go="sound" aria-label="Ses"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg></button>
<button class="key tb" id="nightBtn" aria-label="Gece / gündüz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
<button class="key tb" id="dimBtn" aria-label="Ekstra karartma"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
</div>
<span class="clock" id="clock">--:--</span>
<span style="font-size:3.33vh;font-weight:600" id="date"></span>
<span style="font-size:2.5vh;font-weight:600;color:var(--sub);margin-top:1.39vh" id="speed"></span>
</main>
<aside class="aside">
<article class="card" aria-label="Telefon">
<div style="display:flex;align-items:center;gap:1.94vh">
<div style="width:7.5vh;height:7.5vh;border-radius:50%;background:var(--inner);display:flex;align-items:center;justify-content:center;color:var(--a)"><svg style="width:3.33vh;height:3.33vh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></div>
<div style="display:flex;flex-direction:column;gap:.28vh"><span style="font-size:2.78vh;font-weight:700">Telefon</span><span style="font-size:2.22vh;color:var(--sub)">Rehber ve aramalar</span></div>
</div>
<div style="display:flex;gap:1.39vh">
<button class="key pill" data-go="phone" style="background:var(--a);color:#14110D">Aç</button>
<button class="key pill" data-go="aa" style="background:var(--inner);color:var(--text)">Android Auto</button>
</div>
</article>
<article class="card" aria-label="Müzik" style="flex:1;min-height:0;gap:1.39vh">
<div style="display:flex;align-items:center;gap:1.11vh;color:var(--sub);font-size:1.94vh;font-weight:600"><svg style="width:2.5vh;height:2.5vh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>Müzik</div>
<div style="flex:1;display:flex;align-items:center;justify-content:center" data-go="media"><div style="width:16.67vh;height:16.67vh;border-radius:2.78vh;background:var(--inner);display:flex;align-items:center;justify-content:center;color:var(--sub)"><svg style="width:5.56vh;height:5.56vh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></div></div>
<div style="display:flex;flex-direction:column;gap:.56vh;min-width:0"><span style="font-size:3.06vh;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="title">Çalan bir şey yok</span><span style="font-size:2.36vh;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="artist"></span></div>
<div style="display:flex;align-items:center;gap:1.39vh">
<button class="key mk" id="play" aria-label="Çal / duraklat" style="flex:1.4;background:var(--a);color:#14110D"><svg id="playIcon" style="width:3.61vh;height:3.61vh" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg></button>
<button class="key mk" id="prev" aria-label="Önceki" style="flex:1;background:transparent;color:var(--text)"><svg style="width:3.33vh;height:3.33vh" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
<button class="key mk" id="next" aria-label="Sonraki" style="flex:1;background:transparent;color:var(--text)"><svg style="width:3.33vh;height:3.33vh" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
</div>
</article>
</aside>
</div>
<script src="common.js"></script>
<script>
document.querySelectorAll('[data-go]').forEach(function (b) { b.onclick = function () { call('open', b.getAttribute('data-go')); }; });
var night = true;
$('nightBtn').onclick = function () { night = !night; document.body.classList.toggle('day', !night); call('setNight', night); };
$('dimBtn').onclick = function () { call('toggleDim'); };
$('play').onclick = function () { call('media', 'play'); };
$('prev').onclick = function () { call('media', 'prev'); };
$('next').onclick = function () { call('media', 'next'); };
car.on(function (s) {
  $('clock').textContent = s.time || '--:--';
  $('clockS').textContent = s.time || '--:--';
  $('date').textContent = s.date || '';
  night = !!s.night; document.body.classList.toggle('day', !night);
  $('speed').textContent = s.gps === 'ok' ? s.speed + ' km/s' : '';
  $('title').textContent = s.title || 'Çalan bir şey yok';
  $('artist').textContent = s.artist || '';
  $('playIcon').innerHTML = s.playing ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M7 4v16l13-8z"/>';
});
</script>
</body>
</html>
