<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Motor sesi</title>
</head>
<body>
<script type="module">
// Hidden host for the engine voice: Engine_Sim (MIT, github.com/YigitSalihEmecen/Engine_Sim) running
// inside MYDS. It follows the real car (OBD rpm + accelerator) or a test pedal from motor.html.
// The diesel's 800…carMax rpm band is stretched over the chosen engine's idle…redline, so a Ferrari
// V8 screams near its limit while the DS4 is at 4500.
import { EngineSim } from './src/engine-sim.js';

const RPS = 60 / (2 * Math.PI);
const S = {
  on: false, engine: 'v8flat', vehicle: 'supercar', follow: true, carIdle: 800, carMax: 6000,
  volume: 0.8, interior: true, tone: { rumble: 1, brightness: 1, punch: 1 }, pops: 0.6, turbo: null,
  testThr: 0, testBrake: 0,
};
let autoLow = false, ctxLat = null, frames = 0, sim = null, ctx = null, ctxLite = null, tick = null, lastTickMsg = 0, tickLog = [], last = 0, starting = false, carRpm = 0, carThr = 0, carKmh = 0, err = '';

function car() {
  try { return JSON.parse(window.MotorCar ? MotorCar.data() : '{}'); } catch (e) { return {}; }
}
function report(extra) {
  if (!window.MotorCar) return;
  let st = {};
  try { if (sim) { const g = sim.getState(); st = { rpm: Math.round(g.rpm || 0), gear: g.gear, label: g.engineLabel, boost: g.boost }; } } catch (e) {}
  // how evenly the engine model is updated: ~33 ms is right; hundreds of ms means the page is being throttled
  let avg = 0, mx = 0; tickLog.forEach(v => { avg += v; mx = Math.max(mx, v); }); avg = tickLog.length ? avg / tickLog.length : 0;
  MotorCar.report(JSON.stringify(Object.assign({ on: S.on && !!sim, engine: S.engine, follow: S.follow, carRpm: Math.round(carRpm), carThr: carThr, err: err,
    tickMs: Math.round(avg), tickMax: Math.round(mx), clock: tick && performance.now() - lastTickMsg < 300 ? 'audio' : 'timer', sr: ctx ? ctx.sampleRate : 0, autoLow: autoLow }, st, extra || {})));
}

async function build() {
  if (starting) return;
  starting = true;
  try {
    // Lite (default on the head unit): 22 kHz, no reverb, no oversampling: about a third of the work.
    var lite = S.lite !== false;
    globalThis.MYDS_LITE = lite;
    const rate = lite ? (+S.sr || 22050) : 0;
    if (ctx && (ctxLite !== lite || (rate && ctx.sampleRate !== rate) || ctxLat !== (+S.lat || 0.15))) { try { if (sim) sim.dispose(); } catch (e) {} sim = null; try { ctx.close(); } catch (e) {} ctx = null; }
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      // a deeper output buffer rides out moments when the unit's CPU is busy elsewhere
      const lat = +S.lat || 0.15;
      try { ctx = new AC(lite ? { latencyHint: lat, sampleRate: rate } : { latencyHint: lat }); }
      catch (e) { ctx = new AC({ latencyHint: 'playback' }); }
      ctxLite = lite; ctxLat = +S.lat || 0.15;
      tick = null;
    }
    // drive the engine model from the audio clock (≈30 Hz); timers are only a fallback
    if (!tick && ctx.audioWorklet && window.AudioWorkletNode) {
      try {
        await ctx.audioWorklet.addModule('./tick-worklet.js');
        tick = new AudioWorkletNode(ctx, 'myds-tick', { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [1],
          processorOptions: { every: Math.round(ctx.sampleRate / 30) } });
        const mute = ctx.createGain(); mute.gain.value = 0;
        tick.connect(mute); mute.connect(ctx.destination);   // a node is only run when it leads somewhere
        tick.port.onmessage = () => { lastTickMsg = performance.now(); frame(); };
      } catch (e) { tick = null; }
    }
    if (sim) { try { sim.dispose(); } catch (e) {} sim = null; }
    // wavetable source (no JavaScript on the audio thread): half the cost of the combustion worklet
    sim = new EngineSim(ctx, { engine: S.engine, vehicle: S.vehicle, wavetables: S.wt !== false });
    await sim.start();
    if (S.short !== false && lite) {
      // unit profile: skip the stage-by-stage mastering (3-band compressor, EQ, room, stereo widener,
      // bass harmonics); the cabin filter feeds the limiter directly. The car's amp does the rest.
      try {
        sim.cabin.output.disconnect();
        // one peaking filter + a little gain stand in for the skipped stages (measured: same band balance)
        const pk = ctx.createBiquadFilter(); pk.type = 'peaking'; pk.frequency.value = 650; pk.Q.value = 0.7; pk.gain.value = 4.5;
        const mk = ctx.createGain(); mk.gain.value = 1.26;
        sim.cabin.output.connect(pk); pk.connect(mk); mk.connect(sim.limiter);
        sim.infra[1].disconnect(sim.bass.input); sim.bass.output.disconnect();
      } catch (e) {}
    }
    apply();
    err = '';
  } catch (e) {
    err = String(e && e.message || e);
    sim = null;
  }
  starting = false;
  report();
}
function apply() {
  if (!sim) return;
  try {
    sim.setVolume(S.volume);
    sim.setPerspective(S.interior ? 'interior' : 'exterior');
    sim.setTone(S.tone);
    sim.setPopDepth(S.pops);
    if (S.turbo !== null) sim.setTurbo(S.turbo);
    sim.setAutoShift(true);
  } catch (e) { err = String(e.message || e); }
}

window.M = {
  set(json) {
    const o = typeof json === 'string' ? JSON.parse(json) : json;
    const rebuild = (o.engine && o.engine !== S.engine) || (o.vehicle && o.vehicle !== S.vehicle) || ('lite' in o && o.lite !== (S.lite !== false))
      || ('wt' in o && o.wt !== (S.wt !== false)) || ('sr' in o && o.sr !== S.sr) || ('lat' in o && o.lat !== S.lat) || ('short' in o && o.short !== S.short);
    Object.assign(S, o);
    if (o.tone) S.tone = Object.assign({}, S.tone, o.tone);
    if (!S.on) { if (sim) { try { sim.stop(); sim.dispose(); } catch (e) {} sim = null; } if (ctx) ctx.suspend(); report(); return; }
    if (ctx) ctx.resume();
    if (!sim || rebuild) build(); else apply();
    report();
  },
  pedal(thr, brake) { S.testThr = +thr || 0; S.testBrake = +brake || 0; },
  state() { report(); },
};

function frame() {
  const nowMs = performance.now();
  if (last) { tickLog.push(nowMs - last * 1000); if (tickLog.length > 60) tickLog.shift(); }
  const now = nowMs / 1000;
  const dt = last ? Math.min(0.1, now - last) : 0.016;
  last = now;
  if (!sim || !S.on) return;
  if (++frames % 15 === 0) report();   // state also when timers are slowed
  const c = car();
  carRpm = +c.rpm || 0; carThr = c.thr !== undefined ? +c.thr : (carThr); carKmh = +c.kmh || 0;
  const prof = sim.profile || {};
  const idle = prof.idleRpm || 800, red = prof.redlineRpm || 7000;
  if (S.follow && carRpm > 300) {
    // follow the car: stretch its rpm band over this engine, accelerator from OBD (or from rpm rise)
    const f = Math.max(0, Math.min(1.02, (carRpm - S.carIdle) / Math.max(500, S.carMax - S.carIdle)));
    const target = idle + f * (red - idle);
    sim.setClutch(1);                       // engine free of the virtual gearbox: the car decides rpm
    sim.setThrottle(Math.max(0, Math.min(1, carThr)));
    sim.physics.we = target / RPS;
    sim.update(dt);
    sim.physics.we = target / RPS;
  } else {
    // test mode (pedal on motor.html), or the car is off: the simulator drives itself
    sim.setClutch(0);
    sim.setThrottle(S.testThr);
    sim.setBrake(S.testBrake);
    sim.update(dt);
  }
}
// fallback clock, only while the audio clock is not ticking (no worklet, or the context is suspended)
setInterval(() => { if (performance.now() - lastTickMsg > 150) frame(); }, 33);
setInterval(report, 500);
report({ ready: true });
window.__ctx = () => ctx;   // for the performance test harness

// Self-check: if the audio clock falls behind the wall clock, the CPU cannot keep up and the
// device is dropping sound. Then step down to 16 kHz (about 25 % less work) on its own.
let watch = null;
setInterval(() => {
  if (!ctx || !sim || !S.on || ctx.state !== 'running') { watch = null; return; }
  const now = { w: performance.now() / 1000, c: ctx.currentTime };
  if (!watch) { watch = now; return; }
  const lag = (now.w - watch.w) - (now.c - watch.c);
  watch = now;
  if (lag > 0.12 && (+S.sr || 22050) > 16000) { autoLow = true; S.sr = 16000; build(); watch = null; }
}, 8000);
</script>
</body>
</html>
